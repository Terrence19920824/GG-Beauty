  conflictReasonTextarea.id = 'adjustConflictReason';
  conflictReasonTextarea.rows = 2;
  conflictReasonTextarea.placeholder = adminT('conflictReasonPlaceholder');
  conflictReasonGroup.appendChild(conflictReasonLabel);
  conflictReasonGroup.appendChild(conflictReasonTextarea);
  overrideFields.appendChild(conflictReasonGroup);

  conflictBox.appendChild(overrideFields);
  form.appendChild(conflictBox);

  drawerBody.appendChild(form);

  // 9. Footer Action Buttons
  const cancelBtn = drawerElement('button', 'drawer-status-btn btn-adjust-cancel', adminT('cancel'));
  cancelBtn.type = 'button';
  cancelBtn.id = 'adjustCancelBtn';
  cancelBtn.addEventListener('click', () => {
    activeDrawerMode = 'view';
    renderAppointmentDrawer(appointment);
  });
  drawerFooter.appendChild(cancelBtn);

  const saveBtn = drawerElement('button', 'drawer-status-btn btn-adjust-save', adminT('saveAdjustment'));
  saveBtn.type = 'button';
  saveBtn.id = 'adjustSaveBtn';
  drawerFooter.appendChild(saveBtn);

  let eligibleStaffSet = null;
  const uniqueServiceIds = [...new Set(items.map(it => it.service_id).filter(Boolean))];

  const initSkillCheck = async () => {
    try {
      const shopSlug = getAdminShopSlug();
      if (!shopSlug || uniqueServiceIds.length === 0) return;

      const sets = await Promise.all(uniqueServiceIds.map(async sId => {
        if (serviceEligibleStaffCache.has(sId)) {
          return serviceEligibleStaffCache.get(sId);
        }
        try {
          const res = await fetch(`/api/booking/staff-options?shopSlug=${encodeURIComponent(shopSlug)}&serviceId=${encodeURIComponent(sId)}`, {
            credentials: 'same-origin'
          });
          if (!res.ok) return null;
          const json = await res.json();
          if (json.success && Array.isArray(json.data)) {
            const idSet = new Set(json.data.map(item => String(item.staffId || '').trim()));
            serviceEligibleStaffCache.set(sId, idSet);
            return idSet;
          }
        } catch (_) {}
        return null;
      }));

      if (sets.length > 0 && sets.every(s => s instanceof Set)) {
        const intersection = new Set();
        for (const stId of sets[0]) {
          if (sets.every(s => s.has(stId))) {
            intersection.add(stId);
          }
        }
        eligibleStaffSet = intersection;
        validateStaffSkill();
      }
    } catch (_) {}
  };

  const validateStaffSkill = () => {
    const selectedStaffId = String(staffSelect.value || '').trim();
    if (!selectedStaffId) {
      skillAlert.hidden = true;
      updateFormValidation();
      return;
    }

    const staffObj = staffList.find(s => String(s?.id || '').trim() === selectedStaffId);
    if (staffObj && Array.isArray(staffObj.services)) {
      const staffServiceIds = new Set(staffObj.services.map(s => String(s.id || s.serviceId || s.service_id || s).trim()));
      const hasAll = uniqueServiceIds.every(sId => staffServiceIds.has(String(sId).trim()));
      if (!hasAll) {
        skillAlert.textContent = adminT('staffSkillMismatch');
        skillAlert.hidden = false;
        updateFormValidation();
        return;
      }
    }

    if (eligibleStaffSet instanceof Set) {
      if (!eligibleStaffSet.has(selectedStaffId)) {
        skillAlert.textContent = adminT('staffSkillMismatch');
        skillAlert.hidden = false;
      } else {
        skillAlert.hidden = true;
      }
    } else {
      skillAlert.hidden = true;
    }
    updateFormValidation();
  };

  const updateReassignmentVisibility = () => {
    const selectedStaffId = String(staffSelect.value || '').trim();
    const isReassigned = wasCustomerSpecified && selectedStaffId && selectedStaffId !== origStaffId;
    reassignmentBox.hidden = !isReassigned;
    updateFormValidation();
  };

  const updateFormValidation = () => {
    if (!dateInput.value || !timeInput.value || !staffSelect.value) {
      saveBtn.disabled = true;
      return;
    }

    if (!skillAlert.hidden) {
      saveBtn.disabled = true;
      return;
    }

    if (!reassignmentBox.hidden) {
      const reason = reasonTextarea.value.trim();
      const notified = notifiedCheckbox.checked;
      const agreed = agreedCheckbox.checked;
      if (reason.length < 2 || !notified || !agreed) {
        saveBtn.disabled = true;
        return;
      }
    }

    if (!conflictBox.hidden) {
      const role = getAdminActorRole();
      if (role === 'front_desk') {
        saveBtn.disabled = true;
        return;
      }
      if (overrideCheckbox.checked) {
        const reason = conflictReasonTextarea.value.trim();
        if (reason.length < 2) {
          saveBtn.disabled = true;
          return;
        }
      } else {
        saveBtn.disabled = true;
        return;
      }
    }

    saveBtn.disabled = false;
  };

  staffSelect.addEventListener('change', () => {
    validateStaffSkill();
    updateReassignmentVisibility();
  });

  dateInput.addEventListener('change', () => {
    if (!conflictBox.hidden) conflictBox.hidden = true;
    updateFormValidation();
  });

  timeInput.addEventListener('change', () => {
    if (!conflictBox.hidden) conflictBox.hidden = true;
    updateFormValidation();
  });

  reasonTextarea.addEventListener('input', updateFormValidation);
  notifiedCheckbox.addEventListener('change', updateFormValidation);
  agreedCheckbox.addEventListener('change', updateFormValidation);

  overrideCheckbox.addEventListener('change', () => {
    conflictReasonGroup.hidden = !overrideCheckbox.checked;
    updateFormValidation();
  });
  conflictReasonTextarea.addEventListener('input', updateFormValidation);

  initSkillCheck();
  validateStaffSkill();
  updateReassignmentVisibility();
  updateFormValidation();

  saveBtn.addEventListener('click', async () => {
    const newDate = dateInput.value.trim();
    const newTime = timeInput.value.trim();
    const newStaffId = staffSelect.value.trim();

    if (!newDate || !newTime || !newStaffId) return;

    if (!skillAlert.hidden) {
      showAdminToast(adminT('staffSkillMismatch'), 'error');
      return;
    }

    const isReassigned = wasCustomerSpecified && newStaffId !== origStaffId;
    if (isReassigned) {
      const reason = reasonTextarea.value.trim();
      const notified = notifiedCheckbox.checked;
      const agreed = agreedCheckbox.checked;
      if (reason.length < 2) {
        showAdminToast(adminT('reassignmentReasonRequired'), 'error');
        return;
      }
      if (!notified || !agreed) {
        showAdminToast(adminT('reassignmentConsentRequired'), 'error');
        return;
      }
    }

    const payload = {
      newDate,
      newTime,
      newStaffId
    };

    if (isReassigned) {
      payload.reassignmentReason = reasonTextarea.value.trim();
      payload.customerNotified = true;
      payload.customerAgreed = true;
    }

    if (!conflictBox.hidden && overrideCheckbox.checked) {
      const reason = conflictReasonTextarea.value.trim();
      if (reason.length < 2) {
        showAdminToast(adminT('conflictReasonRequired'), 'error');
        return;
      }
      payload.overrideConflict = true;
      payload.conflictReason = reason;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = adminT('adjusting');
    cancelBtn.disabled = true;
    dateInput.disabled = true;
    timeInput.disabled = true;
    staffSelect.disabled = true;

    try {
      const response = await fetch(`/api/owner/appointments/${encodeURIComponent(appointment.id)}/adjust`, {
        method: 'PATCH',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(() => ({}));

      if (response.ok && result.success) {
        showAdminToast(adminT('appointmentAdjustedSuccess'), 'success');
        activeDrawerMode = 'view';
        await loadAppointments();
        renderAppointmentDrawerById(appointment.id);
        return;
      }

      if (response.status === 409 && result.code === 'APPOINTMENT_COLLISION') {
        const role = getAdminActorRole();
        conflictBox.hidden = false;
        if (role === 'front_desk' || result.canOverride === false) {
          conflictBox.className = 'adjust-conflict-box error-box';
          conflictMessage.className = 'adjust-alert danger';
          conflictMessage.textContent = adminT('conflictNoticeFrontDesk');
          overrideFields.hidden = true;
        } else {
          conflictBox.className = 'adjust-conflict-box override-box';
          conflictMessage.className = 'adjust-alert warning';
          conflictMessage.textContent = adminT('conflictNoticeOwner');
          overrideFields.hidden = false;
          overrideCheckbox.checked = false;
          conflictReasonGroup.hidden = true;
          conflictReasonTextarea.value = '';
        }
        updateFormValidation();
        return;
      }

      if (response.status === 422 && result.code === 'STAFF_SKILL_MISMATCH') {
        skillAlert.textContent = adminT('staffSkillMismatch');
        skillAlert.hidden = false;
        updateFormValidation();
        return;
      }

      showAdminToast(adminResultMessage(result, 'operationFailed'), 'error');
    } catch (_) {
      showAdminToast(adminT('operationFailed'), 'error');
    } finally {
      saveBtn.textContent = adminT('saveAdjustment');
      cancelBtn.disabled = false;
      dateInput.disabled = false;
      timeInput.disabled = false;
      staffSelect.disabled = false;
      updateFormValidation();
    }
  });
}

function formatMinorCurrency(minorValue, currencyCode = 'S$') {
  if (minorValue === null || minorValue === undefined || minorValue === '') return null;
  const num = Number(minorValue);
  if (!Number.isSafeInteger(num) || num < 0) return null;
  const n = BigInt(num);
  const dollars = n / 100n;
  const cents = n % 100n;
  return `${currencyCode}${dollars}.${String(cents).padStart(2, '0')}`;
}

function renderAppointmentDrawer(appointment) {
  if (!appointment) return;
  const safeId = String(appointment.id || '').trim();

  const rawStatus = typeof appointment.status === 'string' ? appointment.status.trim().toLowerCase() : '';
  const canonicalStatus = globalThis.ggI18n && typeof globalThis.ggI18n.normalizeAppointmentStatus === 'function'
    ? globalThis.ggI18n.normalizeAppointmentStatus(rawStatus)
    : (['pending', 'confirmed', 'arrived', 'in_service', 'completed', 'no_show', 'cancelled'].includes(rawStatus) ? rawStatus : 'unknown');
  const statusClass = escapeHtml(canonicalStatus);

  if (activeDrawerMode === 'adjust' && ['pending', 'confirmed'].includes(canonicalStatus)) {
    renderAppointmentAdjustDrawer(appointment, canonicalStatus);
    return;
  }

  const currentAdminLocale = globalThis.ownerSelfService?._state?.locale || globalThis.ggI18n?.DEFAULT_LOCALE || 'zh-CN';

  const recipientName = (appointment.recipient_name_snapshot || appointment.customer_name || appointment.recipient_name || '').trim() || '-';
  const recipientPhone = (appointment.recipient_phone_snapshot || appointment.customer_phone || appointment.recipient_phone || '').trim();
  const recipientEmail = (appointment.recipient_email_snapshot || appointment.customer_email || appointment.recipient_email || '').trim();

  const bookerName = (appointment.booker_name_snapshot || appointment.booker_name || '').trim();
  const bookerPhone = (appointment.booker_phone_snapshot || appointment.booker_phone || '').trim();
  const bookerEmail = (appointment.booker_email_snapshot || appointment.booker_email || '').trim();

  const hasDistinctIds = Boolean(
    appointment.booker_customer_id &&
    appointment.recipient_customer_id &&
    appointment.booker_customer_id !== appointment.recipient_customer_id
  );
  const sameIds = Boolean(
    appointment.booker_customer_id &&
    appointment.recipient_customer_id &&
    appointment.booker_customer_id === appointment.recipient_customer_id
  );
  const hasDistinctNames = Boolean(
    bookerName && recipientName && recipientName !== '-' && bookerName !== recipientName
  );
  const hasDistinctPhones = Boolean(
    bookerPhone && recipientPhone && bookerPhone !== recipientPhone
  );

  const hasDistinctBooker = hasDistinctIds || (!sameIds && (hasDistinctNames || hasDistinctPhones));

  const isVerifiedMember = String(appointment.identity_status || '').trim().toLowerCase() === 'verified_member';
  const memberCode = (typeof appointment.member_code === 'string' && appointment.member_code.trim()) ? appointment.member_code.trim() : null;

  const dateFormatted = appointment.start_at ? getSingaporeDateString(appointment.start_at) : '-';
  const timeFormatted = (appointment.start_at && appointment.end_at)
    ? `${formatSingaporeHourMinute(appointment.start_at)} - ${formatSingaporeHourMinute(appointment.end_at)}`
    : (appointment.start_at ? formatSingaporeHourMinute(appointment.start_at) : '-');

  const phoneToContact = recipientPhone || appointment.customer_phone || bookerPhone;
  const telUri = formatTelUri(phoneToContact);
  const waUri = formatWhatsAppUri(phoneToContact);

  const drawerTitle = safeGetElement('drawerTitle');
  if (drawerTitle) {
    drawerTitle.textContent = adminT('appointmentDetails');
  }

  const closeBtn = safeGetElement('drawerCloseBtn');
  if (closeBtn) {
    closeBtn.setAttribute('aria-label', adminT('close'));
  }

  const drawerBody = safeGetElement('drawerBody');
  if (drawerBody) {
    drawerBody.replaceChildren();

    const statusBar = drawerElement('div', `drawer-status-bar status-${canonicalStatus}`, getStatusText(appointment.status));
    statusBar.setAttribute('role', 'status');
    drawerBody.appendChild(statusBar);

    // Section A: Appointment / 预约信息
    const appointmentSection = appendDrawerSection(drawerBody, adminT('appointmentInfo'));
    if (appointment.appointment_no) {
      appendDrawerField(appointmentSection, adminT('appointmentNoLabel'), appointment.appointment_no, 'drawer-appointment-no notranslate');
    }
    appendDrawerField(appointmentSection, adminT('date'), dateFormatted, 'notranslate');
    appendDrawerField(appointmentSection, adminT('time'), timeFormatted, 'notranslate');
    appendDrawerField(appointmentSection, adminT('status'), getStatusText(appointment.status), 'notranslate');
    if (['pending', 'confirmed'].includes(canonicalStatus)) {
      const adjustBtn = drawerElement('button', 'drawer-adjust-btn', adminT('adjustAppointment'));
      adjustBtn.type = 'button';
      adjustBtn.id = 'drawerAdjustBtn';
      adjustBtn.addEventListener('click', () => {
        activeDrawerMode = 'adjust';
        renderAppointmentDrawer(appointment);
      });
      appointmentSection.appendChild(adjustBtn);
    }

    // Section B: Customer / 顾客
    const customerSection = appendDrawerSection(drawerBody, adminT('customers'));
    const customerNameField = drawerElement('div', 'drawer-field');
    customerNameField.appendChild(drawerElement('span', 'drawer-field-label', hasDistinctBooker ? adminT('recipient') : adminT('customerName')));
    const customerNameVal = drawerElement('span', 'drawer-field-value drawer-customer-name notranslate', recipientName);
    customerNameVal.setAttribute('translate', 'no');
    if (isVerifiedMember) {
      const memberBadge = drawerElement('span', 'drawer-member-badge', adminT('member'));
      memberBadge.setAttribute('role', 'status');
      customerNameVal.appendChild(memberBadge);
    }
    customerNameField.appendChild(customerNameVal);
    customerSection.appendChild(customerNameField);

    if (memberCode) {
      appendDrawerField(customerSection, adminT('memberCode'), memberCode, 'drawer-member-code notranslate');
    }

    appendDrawerField(customerSection, adminT('phone'), recipientPhone || adminT('noCustomerPhone'), 'drawer-customer-phone notranslate');
    if (recipientEmail) {
      appendDrawerField(customerSection, adminT('email'), recipientEmail, 'drawer-customer-email notranslate');
    }

    if (hasDistinctBooker) {
      const bookerBox = drawerElement('div', 'drawer-booker-subsection');
      const bookerTitle = drawerElement('div', 'drawer-booker-title', adminT('booker'));
      bookerBox.appendChild(bookerTitle);
      appendDrawerField(bookerBox, adminT('name'), bookerName || '-', 'notranslate');
      appendDrawerField(bookerBox, adminT('phone'), bookerPhone || adminT('noCustomerPhone'), 'notranslate');
      if (bookerEmail) {
        appendDrawerField(bookerBox, adminT('email'), bookerEmail, 'notranslate');
      }
      customerSection.appendChild(bookerBox);
    } else {
      appendDrawerField(customerSection, adminT('booker'), `${recipientName} (${adminT('bookerSameAsRecipient')})`, 'notranslate');
    }

    if (phoneToContact) {
      const actions = drawerElement('div', 'drawer-contact-actions');
      for (const [href, className, label] of [[telUri, 'drawer-call-btn', adminT('callCustomer')], [waUri, 'drawer-whatsapp-btn', adminT('openWhatsApp')]]) {
        const link = drawerElement('a', `drawer-action-link ${className}`, label);
        link.href = href;
        if (className === 'drawer-whatsapp-btn') { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
        actions.appendChild(link);
      }
      customerSection.appendChild(actions);
    }

    // Section C: Services / 服务项目
    const serviceSection = appendDrawerSection(drawerBody, adminT('servicesAndStaff'));
    const itemsList = Array.isArray(appointment.items) && appointment.items.length ? appointment.items : [appointment];
    for (const it of itemsList) {
      const card = drawerElement('div', 'drawer-item-card');
      const sName = it.service_name_snapshot || it.service_name || appointment.service_name || '-';
      const duration = it.duration_minutes_snapshot || it.duration_minutes || appointment.duration_minutes || '-';
      let priceText = null;
      if (it.price_snapshot_minor !== null && it.price_snapshot_minor !== undefined && it.price_snapshot_minor !== '') {
        priceText = formatMinorCurrency(it.price_snapshot_minor);
      } else if (it.price_snapshot !== null && it.price_snapshot !== undefined) {
        const p = Number(it.price_snapshot);
        if (Number.isFinite(p) && p >= 0) priceText = formatMinorCurrency(Math.round(p * 100));
      } else if (it.price !== null && it.price !== undefined) {
        const p = Number(it.price);
        if (Number.isFinite(p) && p >= 0) priceText = formatMinorCurrency(Math.round(p * 100));
      }

      const headerText = `${sName} · ${duration} ${adminT('minutes')}${priceText ? ` · ${priceText}` : ''}`;
      card.appendChild(drawerElement('div', 'drawer-item-header notranslate', headerText));

      const assignments = Array.isArray(it.staff_assignments) ? it.staff_assignments : [];
      const primaryList = assignments.filter(a => a.role === 'primary');
      const assistantList = assignments.filter(a => a.role === 'assistant');

      const primaryNames = primaryList.map(a => a.staff_name || a.name).filter(Boolean).join(', ') ||
        it.staff_name_snapshot || it.staff_name || appointment.staff_name || '-';
      const assistantNames = assistantList.map(a => a.staff_name || a.name).filter(Boolean).join(', ');

      const rolesBox = drawerElement('div', 'drawer-item-roles');
      const primaryRow = drawerElement('div', 'drawer-item-role-row notranslate');
      primaryRow.appendChild(drawerElement('span', '', `${adminT('primaryStaff')}: `));
      primaryRow.appendChild(drawerElement('strong', '', primaryNames));
      rolesBox.appendChild(primaryRow);

      if (assistantNames) {
        const assistantRow = drawerElement('div', 'drawer-item-role-row notranslate');
        assistantRow.appendChild(drawerElement('span', '', `${adminT('assistantStaff')}: `));
        assistantRow.appendChild(drawerElement('strong', '', assistantNames));
        rolesBox.appendChild(assistantRow);
      }
      card.appendChild(rolesBox);
      serviceSection.appendChild(card);
    }

    // Section D: Notes / 备注
    const notesText = appointment.notes || appointment.remark || '';
    const notesSection = appendDrawerSection(drawerBody, adminT('notes'));
    notesSection.appendChild(drawerElement('div', 'drawer-notes-box notranslate', notesText.trim() || adminT('noNotes')));

    // Section E: Internal Notes / 内部备注
    const internalNotesSection = appendDrawerSection(drawerBody, adminT('internalNotes'));
    internalNotesSection.appendChild(drawerElement('div', 'drawer-field-label', adminT('internalNotesVisibility')));
    const internalNotesInput = drawerElement('textarea', 'drawer-internal-notes-input notranslate');
    internalNotesInput.id = 'drawerInternalNotesInput';
    internalNotesInput.maxLength = 4000;
    internalNotesInput.value = typeof appointment.internal_notes === 'string' ? appointment.internal_notes : '';
    internalNotesInput.setAttribute('aria-label', adminT('internalNotes'));
    internalNotesSection.appendChild(internalNotesInput);
    const canWriteInternalNotes = ['owner', 'manager'].includes(String(getAdminActorRole() || '').toLowerCase());
    internalNotesInput.disabled = !canWriteInternalNotes;
    const internalNotesStatus = drawerElement('div', 'drawer-internal-notes-status', '');
    internalNotesStatus.id = 'drawerInternalNotesStatus';
    internalNotesStatus.setAttribute('role', 'status');
    internalNotesSection.appendChild(internalNotesStatus);
    if (canWriteInternalNotes) {
      internalNotesInput.addEventListener('input', () => {
        if (internalNotesStatus.textContent) {
          internalNotesStatus.textContent = '';
        }
      });
      const saveInternalNotes = drawerElement('button', 'drawer-internal-notes-save primary-btn', adminT('internalNotesSave'));
      saveInternalNotes.type = 'button';
      saveInternalNotes.addEventListener('click', async () => {
        const originalLabel = adminT('internalNotesSave');
        saveInternalNotes.disabled = true;
        internalNotesInput.disabled = true;
        saveInternalNotes.textContent = adminT('internalNotesSaving');
        internalNotesStatus.textContent = adminT('internalNotesSaving');
        try {
          const response = await fetch(`/api/owner/appointments/${encodeURIComponent(String(appointment.id || ''))}/internal-notes`, {
            method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ internalNotes: internalNotesInput.value })
          });
          const result = await response.json();
          if (!response.ok || !result?.success || !result?.data) throw new Error('save failed');
          appointment.internal_notes = result.data.internalNotes;
          internalNotesInput.value = result.data.internalNotes;
          internalNotesStatus.textContent = adminT('internalNotesSaved');
        } catch (_) {
          internalNotesStatus.textContent = adminT('internalNotesSaveFailed');
        } finally {
          saveInternalNotes.disabled = false;
          internalNotesInput.disabled = false;
          saveInternalNotes.textContent = originalLabel;
        }
      });
      internalNotesSection.appendChild(saveInternalNotes);
    }

    // Section F: Checkout / 收银 (read-only projection when available)
    if (appointment.checkout && appointment.checkout.exists) {
      const checkoutSection = appendDrawerSection(drawerBody, adminT('checkout'));
      const checkoutStatusText = globalThis.ggI18n?.formatCheckoutStatus
        ? globalThis.ggI18n.formatCheckoutStatus(appointment.checkout.payment_state || appointment.checkout.checkout_status, currentAdminLocale)
        : (appointment.checkout.payment_state || appointment.checkout.checkout_status);
      appendDrawerField(checkoutSection, adminT('status'), checkoutStatusText, 'notranslate');

      const dueFormatted = formatMinorCurrency(appointment.checkout.final_due_minor);
      if (dueFormatted) {
        appendDrawerField(checkoutSection, adminT('finalDue'), dueFormatted, 'notranslate');
      }

      const paidFormatted = formatMinorCurrency(appointment.checkout.net_paid_minor ?? appointment.checkout.recorded_paid_minor);
      if (paidFormatted) {
        appendDrawerField(checkoutSection, adminT('paidAmount'), paidFormatted, 'notranslate');
      }

      if (appointment.checkout.outstanding_minor && appointment.checkout.outstanding_minor > 0) {
        const outstandingFormatted = formatMinorCurrency(appointment.checkout.outstanding_minor);
        if (outstandingFormatted) {
          appendDrawerField(checkoutSection, adminT('outstandingAmount'), outstandingFormatted, 'notranslate');
        }
      }
    }
  }

  const drawerFooter = safeGetElement('drawerFooter');
  if (drawerFooter) {
    renderDrawerFooterWithTextContent(drawerFooter, canonicalStatus);
  }
}

function bindActionButtonsIn(container) {
  if (typeof container?.querySelectorAll !== 'function') return;
  const buttons = container.querySelectorAll('button[data-action-key]');
  if (!buttons || typeof buttons.forEach !== 'function') return;
  buttons.forEach(btn => {
    const key = btn?.getAttribute ? btn.getAttribute('data-action-key') : (btn?.dataset?.actionKey || btn?.['data-action-key']);
    const record = localActionMap.get(String(key));
    if (!record) return;

    if (typeof btn?.removeAttribute === 'function') {
      btn.removeAttribute('data-action-key');
    } else if (btn?.dataset) {
      delete btn.dataset.actionKey;
    }

    const safeId = String(record.appointmentId || '').trim();
    const recordType = record.type;
    const targetStatus = record.targetStatus;
    const recordCanStart = record.can_start_checkout === true;

    if (typeof btn?.addEventListener === 'function') {
      btn.addEventListener('click', async function onActionClick(event) {
        if (event && typeof event.preventDefault === 'function') {
          event.preventDefault();
        }
        if (event && typeof event.stopPropagation === 'function') {
          event.stopPropagation();
        }

        if (!UUID_REGEX.test(safeId)) {
          console.warn('Invalid appointment ID format rejected');
          return;
        }

        if (!currentAppointmentMap.has(safeId)) {
          return;
        }
        const currentAppt = currentAppointmentMap.get(safeId);
        if (!currentAppt || String(currentAppt.id || '').trim() !== safeId) {
          return;
        }

        const inSnapshot = currentAppointmentsSnapshot.find(a => a && String(a.id || '').trim() === safeId);
        if (!inSnapshot || String(inSnapshot.id || '').trim() !== safeId) {
          return;
        }

        if (recordType === 'checkout') {
          if (globalScope.FEATURE_CHECKOUT_ENABLED !== true) {
            if (typeof alert === 'function') {
              alert(adminT('featureGatedNoticeDesc'));
            }
            return;
          }

          if (recordCanStart !== true || currentAppt.can_start_checkout !== true || inSnapshot.can_start_checkout !== true) {
            return;
          }

          console.info('Checkout workflow initiated for appointment:', safeId);
        } else if (recordType === 'status') {
          if (!ALLOWED_STATUS_MUTATIONS.has(targetStatus)) {
            console.warn('Invalid status mutation rejected');
            return;
          }
          if (btn.disabled) return;
          btn.disabled = true;
          const didSave = await updateAppointmentStatus(safeId, targetStatus);
          if (!didSave) btn.disabled = false;
        }
      });
    }
  });
}

function renderActionButtonsForAppointment(item) {
  const rawStatus = typeof item?.status === 'string' ? item.status.trim().toLowerCase() : '';
  const canonicalStatus = globalThis.ggI18n && typeof globalThis.ggI18n.normalizeAppointmentStatus === 'function'
    ? globalThis.ggI18n.normalizeAppointmentStatus(rawStatus)
    : (['pending', 'confirmed', 'arrived', 'in_service', 'completed', 'no_show', 'cancelled'].includes(rawStatus) ? rawStatus : 'unknown');

  const canCheckout = (globalScope.FEATURE_CHECKOUT_ENABLED === true) && (canStartCheckout(item) === true);
  let checkoutBtnHtml = '';
  if (canCheckout) {
    const kCheckout = String(++localKeySeq);
    localActionMap.set(kCheckout, {
      type: 'checkout',
      appointmentId: item.id,
      can_start_checkout: item.can_start_checkout === true
    });
    checkoutBtnHtml = `<button type="button" class="checkout-btn" data-action="checkout" data-action-key="${kCheckout}" title="${escapeHtml(adminT('goToCheckout'))}">${escapeHtml(adminT('goToCheckout'))}</button>`;
  }

  let statusBtnsHtml = '';
  if (canonicalStatus === 'pending') {
    const kConfirm = String(++localKeySeq);
    localActionMap.set(kConfirm, { type: 'status', appointmentId: item.id, targetStatus: 'confirmed' });
    const kCancel = String(++localKeySeq);
    localActionMap.set(kCancel, { type: 'status', appointmentId: item.id, targetStatus: 'cancelled' });
    statusBtnsHtml = `<button type="button" data-action="status" data-action-key="${kConfirm}" data-target-status="confirmed">${escapeHtml(adminT('confirm'))}</button><button type="button" data-action="status" data-action-key="${kCancel}" data-target-status="cancelled">${escapeHtml(adminT('cancel'))}</button>`;
  } else if (canonicalStatus === 'confirmed') {
    const kArrive = String(++localKeySeq);
    localActionMap.set(kArrive, { type: 'status', appointmentId: item.id, targetStatus: 'arrived' });
    const kNoShow = String(++localKeySeq);
    localActionMap.set(kNoShow, { type: 'status', appointmentId: item.id, targetStatus: 'no_show' });
    const kCancel = String(++localKeySeq);
    localActionMap.set(kCancel, { type: 'status', appointmentId: item.id, targetStatus: 'cancelled' });
    statusBtnsHtml = `<button type="button" data-action="status" data-action-key="${kArrive}" data-target-status="arrived">${escapeHtml(adminT('arrived'))}</button><button type="button" data-action="status" data-action-key="${kNoShow}" data-target-status="no_show">${escapeHtml(adminT('noShow'))}</button><button type="button" data-action="status" data-action-key="${kCancel}" data-target-status="cancelled">${escapeHtml(adminT('cancel'))}</button>`;
  } else if (canonicalStatus === 'arrived') {
    const kInService = String(++localKeySeq);
    localActionMap.set(kInService, { type: 'status', appointmentId: item.id, targetStatus: 'in_service' });
    statusBtnsHtml = `<button type="button" data-action="status" data-action-key="${kInService}" data-target-status="in_service">${escapeHtml(adminT('in_service'))}</button>`;
  } else if (canonicalStatus === 'in_service') {
    const kComplete = String(++localKeySeq);
    localActionMap.set(kComplete, { type: 'status', appointmentId: item.id, targetStatus: 'completed' });
    statusBtnsHtml = `<button type="button" data-action="status" data-action-key="${kComplete}" data-target-status="completed">${escapeHtml(adminT('complete'))}</button>`;
  }

  return { statusBtnsHtml, checkoutBtnHtml, fullHtml: (statusBtnsHtml || checkoutBtnHtml) ? (statusBtnsHtml + checkoutBtnHtml) : '' };
}

function applyAppointmentStatusChangeInPlace(safeId, targetStatus, updatedData = {}) {
  const apptInSnapshot = currentAppointmentsSnapshot.find(a => a && String(a.id || '').trim() === safeId);
  if (apptInSnapshot) {
    apptInSnapshot.status = targetStatus;
    if (updatedData?.updated_at) apptInSnapshot.updated_at = updatedData.updated_at;
  }
  const apptInMap = currentAppointmentMap.get(safeId);
  if (apptInMap) {
    apptInMap.status = targetStatus;
    if (updatedData?.updated_at) apptInMap.updated_at = updatedData.updated_at;
  }
  if (typeof globalScope !== 'undefined' && Array.isArray(globalScope.currentAppointments)) {
    const inGlobal = globalScope.currentAppointments.find(a => a && String(a.id || '').trim() === safeId);
    if (inGlobal) {
      inGlobal.status = targetStatus;
      if (updatedData?.updated_at) inGlobal.updated_at = updatedData.updated_at;
    }
  }

  updateSummary(currentAppointmentsSnapshot);

  const card = (typeof document !== 'undefined' && typeof document.querySelector === 'function')
    ? document.querySelector(`.owner-calendar-appointment[data-appointment-id="${safeId}"]`)
    : null;
  if (card) {
    ALLOWED_STATUS_MUTATIONS.forEach(s => card.classList.remove(`status-${s}`));
    card.classList.remove('status-pending', 'status-unknown');
    card.classList.add(`status-${targetStatus}`);

    const pill = card.querySelector ? card.querySelector('.calendar-status-pill') : null;
    if (pill) {
      ALLOWED_STATUS_MUTATIONS.forEach(s => pill.classList.remove(`status-${s}`));
      pill.classList.remove('status-pending', 'status-unknown');
      pill.classList.add(`status-${targetStatus}`);
      pill.setAttribute('aria-label', getStatusText(targetStatus));
      const textEl = pill.querySelector ? pill.querySelector('.status-text') : null;
      if (textEl) textEl.textContent = getStatusText(targetStatus);
    }

    if (targetStatus !== 'pending' && targetStatus !== 'confirmed') {
      card.classList.remove('is-late');
      const lateBadge = card.querySelector ? card.querySelector('.owner-calendar-late-badge') : null;
      if (lateBadge && typeof lateBadge.remove === 'function') lateBadge.remove();
    }

    const timeDisplay = (card.querySelector && card.querySelector('.calendar-card-time')?.textContent) || '';
    const custName = (card.querySelector && card.querySelector('.calendar-card-customer')?.textContent) || '';
    if (typeof card.setAttribute === 'function') {
      card.setAttribute('aria-label', `${custName} ${timeDisplay} ${getStatusText(targetStatus)}`.trim());
    }

    let actionsContainer = card.querySelector ? card.querySelector('.calendar-card-actions') : null;
    const { fullHtml } = renderActionButtonsForAppointment(apptInSnapshot || { id: safeId, status: targetStatus });
    if (fullHtml) {
      if (!actionsContainer && typeof document.createElement === 'function') {
        actionsContainer = document.createElement('div');
        actionsContainer.className = 'calendar-card-actions';
        if (typeof card.appendChild === 'function') {
          card.appendChild(actionsContainer);
        }
      }
      if (actionsContainer) {
        actionsContainer.innerHTML = fullHtml;
        bindActionButtonsIn(actionsContainer);
      }
    } else if (actionsContainer && typeof actionsContainer.remove === 'function') {
      actionsContainer.remove();
    }
  }

  const row = (typeof document !== 'undefined' && typeof document.querySelector === 'function')
    ? document.querySelector(`tr[data-appointment-id="${safeId}"]`)
    : null;
  if (row) {
    const statusSpan = row.querySelector ? row.querySelector('.status') : null;
    if (statusSpan) {
      ALLOWED_STATUS_MUTATIONS.forEach(s => statusSpan.classList.remove(`status-${s}`, s));
      statusSpan.classList.remove('status-pending', 'status-unknown', 'pending', 'unknown');
      statusSpan.classList.add('status', targetStatus);
      statusSpan.setAttribute('aria-label', getStatusText(targetStatus));
      const textEl = statusSpan.querySelector ? statusSpan.querySelector('.status-text') : null;
      if (textEl) textEl.textContent = getStatusText(targetStatus);
    }

    if (targetStatus !== 'pending' && targetStatus !== 'confirmed') {
      row.classList.remove('is-late');
      const lateBadge = row.querySelector ? row.querySelector('.owner-calendar-late-badge') : null;
      if (lateBadge && typeof lateBadge.remove === 'function') lateBadge.remove();
    }

    const actionsTd = row.cells?.[row.cells.length - 1];
    if (actionsTd) {
      const { fullHtml } = renderActionButtonsForAppointment(apptInSnapshot || { id: safeId, status: targetStatus });
      actionsTd.innerHTML = fullHtml;
      bindActionButtonsIn(actionsTd);
    }
  }

  if (activeDrawerAppointmentId === safeId) {
    const appt = apptInSnapshot || currentAppointmentMap.get(safeId);
    if (appt) {
      renderAppointmentDrawer(appt);
    }
  }
}

async function updateAppointmentStatus(id, status) {
  const safeId = String(id || '').trim();
  if (!UUID_REGEX.test(safeId)) {
    console.warn('Invalid appointment ID format rejected');
    return false;
  }
  if (typeof status !== 'string' || !ALLOWED_STATUS_MUTATIONS.has(status)) {
    console.warn('Invalid status mutation rejected');
    return false;
  }

  const promptKey = { confirmed: 'confirmAppointmentPrompt', arrived: 'arrivedAppointmentPrompt', in_service: 'startServicePrompt', completed: 'completeAppointmentPrompt', no_show: 'noShowAppointmentPrompt', cancelled: 'cancelAppointmentPrompt' }[status];

  if (promptKey && typeof confirm === 'function' && !confirm(adminT(promptKey))) {
    return false;
  }

  try {
    const response = await fetch('/api/admin/update-status-db', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        appointmentId: safeId,
        status: status
      })
    });

    const result = await response.json();

    if (response.status === 401 || response.status === 403) {
      showLogin(adminT('sessionExpired'));
      return false;
    }

    if (!response.ok || !result.success) {
      throw new Error(adminResultMessage(result, 'operationFailed'));
    }

    applyAppointmentStatusChangeInPlace(safeId, status, result.data);
    showAdminToast(adminT('statusUpdatedSuccess'), 'success');
    return true;

  } catch (error) {
    const errorMsg = error.message || adminT('operationFailed');
    showAdminToast(errorMsg, 'error');
    if (typeof alert === 'function') {
      alert(errorMsg);
    }
    return false;
  }
}

function setupAppointmentDrawer() {
  const closeBtn = safeGetElement('drawerCloseBtn');
  if (closeBtn && !closeBtn._drawerBound && typeof closeBtn.addEventListener === 'function') {
    closeBtn.addEventListener('click', closeAppointmentDrawer);
    closeBtn._drawerBound = true;
  }
  const backdrop = safeGetElement('appointmentDrawerBackdrop');
  if (backdrop && !backdrop._drawerBound && typeof backdrop.addEventListener === 'function') {
    backdrop.addEventListener('click', closeAppointmentDrawer);
    backdrop._drawerBound = true;
  }
  if (!globalScope._drawerKeydownBound) {
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activeDrawerAppointmentId) {
        closeAppointmentDrawer();
      }
    });
    globalScope._drawerKeydownBound = true;
  }
}

function getActiveDrawerAppointmentId() {
  return activeDrawerAppointmentId;
}

globalScope.openAppointmentDrawer = openAppointmentDrawer;
globalScope.closeAppointmentDrawer = closeAppointmentDrawer;
globalScope.getActiveDrawerAppointmentId = getActiveDrawerAppointmentId;
globalScope.renderAppointmentDrawerById = renderAppointmentDrawerById;
globalScope.renderAppointmentDrawer = renderAppointmentDrawer;
globalScope.updateAppointmentStatus = updateAppointmentStatus;
globalScope.showAdminToast = showAdminToast;
globalScope.formatTelUri = formatTelUri;
globalScope.formatWhatsAppUri = formatWhatsAppUri;
globalScope.setupAppointmentDrawer = setupAppointmentDrawer;
globalScope.applyAppointmentStatusChangeInPlace = applyAppointmentStatusChangeInPlace;
globalScope.renderAppointmentAdjustDrawer = renderAppointmentAdjustDrawer;
globalScope.computeAdjustEndTime = computeAdjustEndTime;
globalScope.getAdminActorRole = getAdminActorRole;
globalScope.setAdminProfile = function(profile) { currentAdminProfile = profile; };
globalScope.getActiveDrawerMode = function() { return activeDrawerMode; };
globalScope.setActiveDrawerMode = function(mode) { activeDrawerMode = mode; };

document.addEventListener(
  'DOMContentLoaded',
  () => {
    if (typeof setupCalendarToolbar === 'function') {
      setupCalendarToolbar();
    }
    if (typeof setupAppointmentDrawer === 'function') {
      setupAppointmentDrawer();
    }
    return initializeAdmin();
  }
);

</script>
