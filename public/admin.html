<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="ownerPageTitle">GG-Beauty 老板端预约后台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "PingFang SC", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      color: #777;
    }

    .refresh-btn {
      border: none;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .main-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
    }

    .nav-btn,
    .secondary-btn,
    .primary-btn,
    .danger-soft-btn {
      border: 1px solid #ddd;
      background: white;
      color: #222;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      white-space: nowrap;
    }

    .nav-btn.active,
    .primary-btn {
      background: #111;
      color: white;
      border-color: #111;
    }

    .nav-btn[disabled] {
      background: #eee;
    }

    .view[hidden],
    .panel[hidden] {
      display: none;
    }

    .toolbar,
    .form-actions,
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar h2,
    .section-heading h3 {
      margin: 0;
    }

    .management-grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.4fr);
      gap: 16px;
    }

    .list-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .list-card.selected {
      border-color: #111;
      box-shadow: 0 0 0 1px #111;
    }

    .list-card h3 {
      margin: 0 0 8px;
    }

    .muted,
    .hint {
      color: #777;
      font-size: 13px;
    }

    .pill {
      display: inline-block;
      padding: 4px 8px;
      margin: 3px 4px 0 0;
      border-radius: 999px;
      background: #f0f0f0;
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font: inherit;
    }

    .check-row,
    .schedule-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 4px;
      border-bottom: 1px solid #eee;
    }

    .check-row label {
      flex: 1;
    }

    .schedule-row .weekday {
      width: 52px;
      font-weight: 600;
    }

    .schedule-row input[type="time"] {
      min-width: 110px;
      padding: 8px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin: 18px 0 14px;
    }

    .tab-btn {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      padding: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      border-color: #111;
      font-weight: 700;
    }

    .notice {
      border-radius: 10px;
      background: #fff8df;
      color: #735c00;
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 14px;
    }

    .save-status {
      min-height: 20px;
      color: #087443;
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .summary-card .number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .summary-card .label {
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      font-weight: 600;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .pending {
      background: #fff3cd;
      color: #8a6d00;
    }

    .confirmed {
      background: #d9f7e8;
      color: #087443;
    }

    .cancelled {
      background: #fde2e2;
      color: #a61b1b;
    }

    .completed {
      background: #e8e8e8;
      color: #444;
    }

    .empty,
    .error,
    .loading {
      padding: 30px 10px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 800px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .card {
        overflow-x: auto;
      }

      table {
        min-width: 850px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .management-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
<div id="loginOverlay" style="
  position: fixed;
  inset: 0;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
">
  <div style="
    width: 360px;
    background: white;
    padding: 32px;
    border-radius: 16px;
  ">
    <h2 data-i18n="ownerLogin">GG-Beauty 老板登录</h2>

    <input
      id="ownerLoginIdentifier"
      type="text"
      autocomplete="username"
      placeholder="请输入登录账号"
      data-i18n-placeholder="loginAccount"
      style="
        width: 100%;
        padding: 14px;
        margin: 18px 0 0;
      "
    >

    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      placeholder="请输入密码"
      data-i18n-placeholder="password"
      style="
        width: 100%;
        padding: 14px;
        margin: 12px 0 0;
      "
    >

    <input
      id="ownerShopSlug"
      type="text"
      placeholder="店铺标识（如有多家店）"
      data-i18n-placeholder="shopSlug"
      style="
        width: 100%;
        padding: 14px;
        margin: 12px 0;
      "
    >

    <button
      onclick="adminLogin()"
      style="
        width: 100%;
        padding: 14px;
        background: #111;
        color: white;
        border: 0;
        border-radius: 8px;
      "
    >
      <span data-i18n="login">登录</span>
    </button>

    <div
      id="loginMessage"
      style="margin-top: 12px; color: red;"
    ></div>
  </div>
</div>
<div class="container" id="adminContent" hidden>

  <div class="header">
    <div>
      <button id="adminLanguageZh" class="refresh-btn" type="button" onclick="ownerSelfService.setLocale('zh-CN')">中文</button>
      <button id="adminLanguageEn" class="refresh-btn" type="button" onclick="ownerSelfService.setLocale('en')">EN</button>
      <h1 data-i18n="ownerTitle">GG-Beauty 老板端</h1>
      <p data-i18n="ownerSubtitle">预约管理后台</p>
    </div>

    <div>
      <button
        class="refresh-btn"
        onclick="loadAppointments()"
      >
        <span data-i18n="refreshAppointments">刷新预约</span>
      </button>
      <button
        class="refresh-btn"
        onclick="ownerLogout()"
      >
        <span data-i18n="logout">退出登录</span>
      </button>
    </div>
  </div>

  <nav class="main-nav" aria-label="老板后台导航">
    <button id="nav-calendar" class="nav-btn active" data-i18n="calendar" onclick="ownerSelfService.showView('calendar')">日历</button>
    <button id="nav-staff" class="nav-btn" data-i18n="staff" onclick="ownerSelfService.showView('staff')">员工</button>
    <button id="nav-services" class="nav-btn" data-i18n="services" onclick="ownerSelfService.showView('services')">服务</button>
    <button class="nav-btn" disabled data-i18n="customers" data-i18n-title="comingSoon" title="即将推出">顾客</button>
    <button class="nav-btn" disabled data-i18n="checkout" data-i18n-title="comingSoon" title="即将推出">收银</button>
    <button class="nav-btn" disabled data-i18n="more" data-i18n-title="comingSoon" title="即将推出">更多</button>
  </nav>

  <section id="calendarView" class="view">

  <div class="summary">

    <div class="summary-card">
      <div class="label" data-i18n="allAppointments">全部预约</div>
      <div class="number" id="totalCount">0</div>
    </div>

    <div class="summary-card">
      <div class="label" data-i18n="pendingAppointments">待确认</div>
      <div class="number" id="pendingCount">0</div>
    </div>

    <div class="summary-card">
      <div class="label" data-i18n="todayAppointments">今日预约</div>
      <div class="number" id="todayCount">0</div>
    </div>

  </div>

  <div class="card">

    <div id="content" class="loading">
      <span data-i18n="loadingAppointments">正在读取预约...</span>
    </div>

  </div>

  </section>

  <section id="servicesView" class="view" hidden>
    <div class="toolbar">
      <div><h2 data-i18n="serviceCategories">服务分类</h2><div class="muted" data-i18n="categoryHelp">管理分类名称、图标、排序与状态</div></div>
      <button id="addCategoryButton" class="primary-btn" data-i18n="addCategory" onclick="ownerSelfService.openCategoryForm()">新增分类</button>
    </div>
    <div class="card"><div id="categoriesMessage" class="save-status"></div><div id="categoriesList" class="loading" data-i18n="loadingCategories">正在读取分类...</div></div>
    <div id="categoryFormPanel" class="card panel" hidden style="margin-top:16px">
      <div class="section-heading"><h3 id="categoryFormTitle" data-i18n="addCategory">新增分类</h3></div>
      <div class="form-grid">
        <label class="field"><span data-i18n="chineseName">中文名称</span><input id="categoryNameZh" maxlength="200"></label>
        <label class="field"><span data-i18n="englishName">English Name</span><input id="categoryNameEn" maxlength="200"></label>
        <label class="field"><span data-i18n="icon">图标</span><input id="categoryIconKey" maxlength="100"></label>
        <label class="field"><span data-i18n="sortOrder">排序</span><input id="categorySortOrder" type="number" min="0"></label>
        <label class="check-row"><input id="categoryActive" type="checkbox"><span data-i18n="active">启用</span></label>
      </div>
      <div class="form-actions"><button class="secondary-btn" data-i18n="cancel" onclick="ownerSelfService.closeCategoryForm()">取消</button><button id="saveCategoryButton" class="primary-btn" data-i18n="save" onclick="ownerSelfService.saveCategory()">保存</button></div>
    </div>
    <div class="toolbar">
      <div><h2 data-i18n="serviceManagement">服务项目</h2><div class="muted" data-i18n="serviceHelp">管理价格、时长与顾客预约状态</div></div>
      <button id="addServiceButton" class="primary-btn" data-i18n="addService" onclick="ownerSelfService.openServiceForm()">新增服务</button>
    </div>
    <div class="card">
      <div id="servicesMessage" class="save-status"></div>
      <div id="servicesList" class="loading" data-i18n="loadingServices">正在读取服务...</div>
    </div>
    <div id="serviceFormPanel" class="card panel" hidden style="margin-top:16px">
      <div class="section-heading"><h3 id="serviceFormTitle">新增服务</h3></div>
      <div class="form-grid">
        <label class="field"><span data-i18n="chineseName">中文名称</span><input id="serviceNameZh" maxlength="200"></label>
        <label class="field"><span data-i18n="englishName">English Name</span><input id="serviceNameEn" maxlength="200"></label>
        <label class="field"><span data-i18n="category">分类</span><select id="serviceCategoryId"></select></label>
        <label class="field full"><span data-i18n="chineseDescription">中文说明</span><textarea id="serviceDescriptionZh" maxlength="2000"></textarea></label>
        <label class="field full"><span data-i18n="englishDescription">English Description</span><textarea id="serviceDescriptionEn" maxlength="2000"></textarea></label>
        <label class="field"><span data-i18n="price">价格</span><input id="servicePrice" type="number" min="0" step="0.01"></label>
        <label class="field"><span data-i18n="durationMinutes">服务时长（分钟）</span><input id="serviceDuration" type="number" min="1" max="1440"></label>
        <label class="field"><span data-i18n="sortOrder">排序</span><input id="serviceSortOrder" type="number" min="0"></label>
        <label class="check-row"><input id="serviceBookable" type="checkbox"><span data-i18n="allowBooking">允许顾客预约</span></label>
        <label class="check-row"><input id="serviceActive" type="checkbox"><span data-i18n="serviceActive">启用项目</span></label>
        <label class="check-row"><input id="servicePriceIsFrom" type="checkbox"><span data-i18n="startingPrice">起价 / From</span></label>
      </div>
      <div class="form-actions"><button class="secondary-btn" data-i18n="cancel" onclick="ownerSelfService.closeServiceForm()">取消</button><button id="saveServiceButton" class="primary-btn" data-i18n="save" onclick="ownerSelfService.saveService()">保存</button></div>
    </div>
  </section>

  <section id="staffView" class="view" hidden>
    <div class="toolbar">
      <div><h2 data-i18n="staffManagement">员工</h2><div class="muted" data-i18n="staffHelp">管理员工资料、服务能力与排班</div></div>
      <button id="addStaffButton" class="primary-btn" data-i18n="addStaff" onclick="ownerSelfService.openStaffForm()">新增员工</button>
    </div>
    <div class="management-grid">
      <div class="card"><div id="staffMessage" class="save-status"></div><div id="staffList" class="loading" data-i18n="loadingStaff">正在读取员工...</div></div>
      <div id="staffDetail" class="card"><div class="empty" data-i18n="chooseStaff">请选择一位员工</div></div>
    </div>
  </section>

</div>

<script src="/shared-i18n.js"></script>
<script src="/service-locale.js"></script>
<script src="/admin-self-service.js"></script>

<script>

const content =
  document.getElementById('content');

const loginOverlay =
  document.getElementById('loginOverlay');

const adminContent =
  document.getElementById('adminContent');

let currentAppointments = [];
globalThis.currentAppointments = currentAppointments;
const adminT = key => globalThis.ggI18n.t(
  key,
  globalThis.ownerSelfService?._state.locale || globalThis.ggI18n.DEFAULT_LOCALE
);
const adminResultMessage = (result, fallbackKey) =>
  globalThis.ownerSelfService?._state.locale === 'zh-CN' && result?.message
    ? result.message
    : adminT(fallbackKey);

function showLogin(message = '') {
  adminContent.hidden = true;
  loginOverlay.style.display = 'flex';

  document
    .getElementById('loginMessage')
    .textContent = message;

  document
    .getElementById('adminPassword')
    .value = '';

  document.getElementById('totalCount').textContent = '0';
  document.getElementById('pendingCount').textContent = '0';
  document.getElementById('todayCount').textContent = '0';

  content.className = 'loading';
  currentAppointments = [];
  globalThis.currentAppointments = currentAppointments;
  content.textContent = adminT('loginRequired');

  if (globalThis.ownerSelfService) {
    globalThis.ownerSelfService.reset();
  }
}

function showAdmin() {
  loginOverlay.style.display = 'none';
  adminContent.hidden = false;
}

async function initializeAdmin() {
  try {
    const response = await fetch('/api/owner/me', {
      credentials: 'same-origin'
    });

    if (response.status === 401) {
      showLogin();
      return;
    }

    if (!response.ok) {
      showLogin(adminT('authCheckFailed'));
      return;
    }

    const result = await response.json();

    if (globalThis.ownerSelfService) {
      globalThis.ownerSelfService.setProfile(result.data || {});
    }

    showAdmin();
    await loadAppointments();
  } catch (_error) {
    showLogin(adminT('authCheckFailed'));
  }
}

async function adminLogin() {
  const loginIdentifier = document
    .getElementById('ownerLoginIdentifier')
    .value
    .trim();
  const password = document.getElementById('adminPassword').value;
  const shopSlug = document
    .getElementById('ownerShopSlug')
    .value
    .trim();
  const message = document.getElementById('loginMessage');

  if (!loginIdentifier || !password) {
    message.textContent = adminT('loginRequiredFields');
    return;
  }

  message.textContent = adminT('loggingIn');

  try {
    const loginBody = {
      loginIdentifier,
      password
    };

    if (shopSlug) {
      loginBody.shopSlug = shopSlug;
    }

    const response = await fetch('/api/owner/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(loginBody)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      message.textContent = adminResultMessage(result, 'loginFailed');
      return;
    }

    message.textContent = '';

    if (globalThis.ownerSelfService) {
      globalThis.ownerSelfService.setProfile(result.data || {});
    }

    showAdmin();

    await loadAppointments();

  } catch (error) {
    message.textContent = adminT('loginFailed');
  }
}

async function ownerLogout() {
  try {
    const response = await fetch('/api/owner/logout', {
      method: 'POST',
      credentials: 'same-origin'
    });

    if (!response.ok) {
      throw new Error(adminT('logoutFailed'));
    }

    showLogin(adminT('loggedOut'));
  } catch (_error) {
    alert(adminT('logoutFailed'));
  }
}
// 格式化新加坡时间
function formatSingaporeTime(dateString) {

  if (!dateString) return '-';

  const date =
    new Date(dateString);

  return new Intl.DateTimeFormat(
    globalThis.ownerSelfService?._state.locale || 'en',
    {
      timeZone: 'Asia/Singapore',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }
  ).format(date);
}


function getStatusText(status) {
  return globalThis.ggI18n.formatStatus(status, globalThis.ownerSelfService?._state.locale || 'en') || status || '-';
}


// 今天日期（新加坡）
function getSingaporeToday() {

  return new Intl.DateTimeFormat(
    'en-CA',
    {
      timeZone: 'Asia/Singapore',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }
  ).format(new Date());
}


// 加载预约
async function loadAppointments() {

  content.className = 'loading';

  content.textContent =
    adminT('loadingAppointments');

  try {

    const response =
      await fetch('/api/appointments-db', {
        credentials: 'same-origin'
      });

    const result =
      await response.json();

    if (response.status === 401) {
      showLogin(adminT('sessionExpired'));

      return;
    }

    if (!response.ok || !result.success) {
      throw new Error(
        adminResultMessage(result, 'error')
      );
    }

    const appointments =
      result.data || [];

    currentAppointments = appointments;
    globalThis.currentAppointments = currentAppointments;

    updateSummary(appointments);

    renderAppointments(appointments);

  } catch (error) {

    content.className = 'error';

    content.textContent =
      error.message;

  }
}


// 更新顶部统计
function updateSummary(appointments) {

  document
    .getElementById('totalCount')
    .textContent =
    appointments.length;

  document
    .getElementById('pendingCount')
    .textContent =
    appointments.filter(
      item => item.status === 'pending'
    ).length;

  const today =
    getSingaporeToday();

  const todayCount =
    appointments.filter(item => {

      if (!item.start_at) {
        return false;
      }

      const date =
        new Intl.DateTimeFormat(
          'en-CA',
          {
            timeZone: 'Asia/Singapore',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }
        ).format(
          new Date(item.start_at)
        );

      return date === today;

    }).length;

  document
    .getElementById('todayCount')
    .textContent =
    todayCount;
}


// 显示预约表格
function renderAppointments(appointments) {

  if (
    !appointments ||
    appointments.length === 0
  ) {

    content.className = 'empty';

    content.textContent =
      adminT('noAppointments');

    return;
  }

  content.className = '';

  const rows =
    appointments.map(item => {

      const statusClass =
        item.status || 'pending';

      return `
        <tr>

          <td>
            ${formatSingaporeTime(
              item.start_at
            )}
          </td>

          <td>
            ${item.customer_name || '-'}
          </td>

          <td>
            ${item.customer_phone || '-'}
          </td>

          <td>
            ${item.service_name || '-'}
          </td>

          <td>
            ${item.staff_name || '-'}
          </td>

          <td>
            <span
              class="status ${statusClass}"
            >
              ${getStatusText(
                item.status
              )}
            </span>
          </td>

        
      <td>
  <button onclick="updateAppointmentStatus('${item.id}', 'confirmed')">${adminT('confirm')}</button>
  <button onclick="updateAppointmentStatus('${item.id}', 'completed')">${adminT('complete')}</button>
  <button onclick="updateAppointmentStatus('${item.id}', 'cancelled')">${adminT('cancel')}</button>
</td>
</tr>
`;

    }).join('');

  content.innerHTML = `
    <table>

      <thead>
        <tr>
          <th>${adminT('appointmentTime')}</th>
          <th>${adminT('customerName')}</th>
          <th>${adminT('phone')}</th>
          <th>${adminT('service')}</th>
          <th>${adminT('staff')}</th>
          <th>${adminT('status')}</th>
          <th>${adminT('actions')}</th>
        </tr>
      </thead>

      <tbody>
        ${rows}
      </tbody>

    </table>
  `;
}
async function updateAppointmentStatus(id, status) {
  const promptKey = { confirmed: 'confirmAppointmentPrompt', completed: 'completeAppointmentPrompt', cancelled: 'cancelAppointmentPrompt' }[status];

  if (!confirm(adminT(promptKey))) {
    return;
  }

  try {
    const response = await fetch('/api/admin/update-status-db', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        appointmentId: id,
        status: status
      })
    });

    const result = await response.json();

    if (response.status === 401) {
      showLogin(adminT('sessionExpired'));
      return;
    }

    if (!response.ok || !result.success) {
      throw new Error(adminResultMessage(result, 'operationFailed'));
    }

    await loadAppointments();

  } catch (error) {
    alert(error.message || adminT('operationFailed'));
  }
}

document.addEventListener(
  'DOMContentLoaded',
  initializeAdmin
);

</script>
