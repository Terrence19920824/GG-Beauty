<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="customerPageTitle">GG-Beauty 在线预约</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "PingFang SC", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .header p {
      color: #777;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .date-picker {
      position: relative;
    }

    .date-picker-display {
      min-height: 49px;
    }

    .date-picker input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 18px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .time-btn {
      padding: 11px 5px;
      border: 1px solid #ddd;
      border-radius: 9px;
      text-align: center;
      background: white;
      cursor: pointer;
    }

    .time-btn.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      color: green;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>GG-Beauty</h1>
    <p data-i18n="onlineAppointment">在线预约</p>
    <div><button id="languageZh" type="button">中文</button> <button id="languageEn" type="button">EN</button></div>
  </div>

  <div class="card">

    <label id="serviceLabel" data-i18n="serviceManagement">服务项目</label>
    <select id="service">
      <option value="" data-i18n="loadingCustomerServices">正在读取服务...</option>
    </select>

    <label data-i18n="chooseStaffCustomer">选择员工</label>
    <select id="staff">
      <option value="" data-i18n="customerStaffLoading">正在读取员工...</option>
    </select>

    <label data-i18n="appointmentDate">预约日期</label>
    <div class="date-picker">
      <input type="text" id="dateDisplay" class="date-picker-display" readonly aria-hidden="true">
      <input type="date" id="date" aria-label="预约日期">
    </div>

    <label data-i18n="availableTimes">可预约时间</label>

    <div id="times" class="time-grid">
      <div data-i18n="chooseDate">请先选择日期</div>
    </div>

  </div>

  <div class="card">

    <label data-i18n="name">姓名</label>
    <input
      type="text"
      id="customerName"
      placeholder="请输入姓名"
      data-i18n-placeholder="enterName"
    >

    <label data-i18n="customerPhone">手机号码</label>
    <input
      type="tel"
      id="phone"
      placeholder="请输入手机号码"
      data-i18n-placeholder="enterPhone"
    >

    <label data-i18n="optionalEmail">Email（选填）</label>
    <input
      type="email"
      id="email"
      placeholder="example@email.com"
    >

    <button id="submitBtn">
      <span data-i18n="bookAppointment">确认预约</span>
    </button>

    <div id="message" class="message"></div>

  </div>

</div>

<script src="/shared-i18n.js"></script>
<script src="/service-locale.js"></script>
<script src="/customer-shop-context.js"></script>
<script>

let selectedTime = '';
let availableServices = [];
let availableStaff = [];
let availabilityIsEmpty = false;
let customerShopSlug = '';
const NO_PREFERENCE_VALUE = '__no_preference__';
const localeApi = globalThis.ggI18n;
const shopContextApi = globalThis.ggCustomerShopContext;
const customerT = key => localeApi.t(key, currentLocale);

function initialLocale() {
  return localeApi.getStoredLocale(localStorage, navigator);
}

let currentLocale = initialLocale();

async function loadCustomerShopContext() {
  const candidate = shopContextApi.resolveCandidate(globalThis.location);
  if (!candidate) throw new Error('Missing or invalid shop context');
  const response = await fetch(`/api/booking/context?shopSlug=${encodeURIComponent(candidate)}`);
  const result = await response.json();
  if (!response.ok || result.success === false || !result.data?.shopSlug) {
    throw new Error(result.message || 'Shop is unavailable');
  }
  customerShopSlug = result.data.shopSlug;
}

function selectedService() {
  return availableServices.find(item => item.id === serviceInput.value) || null;
}

function serviceOptionText(service) {
  return `${service.name} · ${localeApi.formatPrice(service.price, service.priceIsFrom, currentLocale)} · ${localeApi.formatDuration(service.durationMinutes, currentLocale)}`;
}

function renderServices() {
  serviceInput.innerHTML = '';
  for (const service of availableServices) {
    const option = document.createElement('option');
    option.value = service.id;
    option.textContent = serviceOptionText(service);
    serviceInput.appendChild(option);
  }
  if (!availableServices.length) {
    const option = document.createElement('option');
    option.value = '';
    option.textContent = customerT('noCustomerServices');
    serviceInput.appendChild(option);
  }
}

async function loadServices() {
  if (!customerShopSlug) return;
  const response = await fetch(`/api/services-db?shopSlug=${encodeURIComponent(customerShopSlug)}&locale=${encodeURIComponent(currentLocale)}`);
  const result = await response.json();
  if (!response.ok || result.success === false) throw new Error(result.message || customerT('noCustomerServices'));
  availableServices = result.data || [];
  renderServices();
  await loadStaffOptions();
}

function renderStaffOptions() {
  staffInput.innerHTML = '';
  const noPreference = document.createElement('option');
  noPreference.value = NO_PREFERENCE_VALUE;
  noPreference.textContent = customerT('customerStaffNoPreference');
  staffInput.appendChild(noPreference);
  for (const member of availableStaff) {
    const option = document.createElement('option');
    option.value = member.staffId;
    option.textContent = member.displayName;
    staffInput.appendChild(option);
  }
  if (!availableStaff.length) {
    const option = document.createElement('option');
    option.value = '';
    option.disabled = true;
    option.textContent = customerT('customerStaffNone');
    staffInput.appendChild(option);
  }
}

async function loadStaffOptions() {
  const service = selectedService();
  availableStaff = [];
  if (!service) {
    renderStaffOptions();
    return;
  }
  staffInput.innerHTML = `<option value="">${customerT('customerStaffLoading')}</option>`;
  const response = await fetch(`/api/booking/staff-options?shopSlug=${encodeURIComponent(customerShopSlug)}&serviceId=${encodeURIComponent(service.id)}`);
  const result = await response.json();
  if (!response.ok || result.success === false) throw new Error(result.message || customerT('customerStaffNone'));
  availableStaff = result.data || [];
  renderStaffOptions();
}

async function setLocale(locale) {
  currentLocale = localeApi.setLocale(locale, localStorage);
  document.documentElement.lang = currentLocale;
  document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = customerT(element.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = customerT(element.dataset.i18nPlaceholder); });
  document.getElementById('languageZh').disabled = currentLocale === 'zh-CN';
  document.getElementById('languageEn').disabled = currentLocale === 'en';
  dateInput.lang = currentLocale;
  renderSelectedDate();
  if (availabilityIsEmpty) {
    timesBox.innerHTML = `<div>${customerT('noTimes')}</div>`;
  }
  try { await loadServices(); } catch (error) { messageBox.textContent = error.message; }
}

const dateInput =
  document.getElementById('date');

const dateDisplay =
  document.getElementById('dateDisplay');

const staffInput =
  document.getElementById('staff');

const serviceInput =
  document.getElementById('service');

const timesBox =
  document.getElementById('times');

const messageBox =
  document.getElementById('message');


// 不允许选择过去日期
const today =
  new Date().toISOString().split('T')[0];

dateInput.min = today;

function renderSelectedDate() {
  dateDisplay.value = localeApi.formatDate(dateInput.value, currentLocale);
}


// 日期 / 员工 / 项目变化时重新读取时间
dateInput.addEventListener(
  'change',
  () => {
    renderSelectedDate();
    loadAvailableTimes();
  }
);

staffInput.addEventListener(
  'change',
  loadAvailableTimes
);

serviceInput.addEventListener(
  'change',
  async () => {
    selectedTime = '';
    try {
      await loadStaffOptions();
      await loadAvailableTimes();
    } catch (error) {
      timesBox.innerHTML = `<div class="error">${error.message}</div>`;
    }
  }
);


// 获取数据库可预约时间
async function loadAvailableTimes() {

  const date = dateInput.value;
  const staffSelection = staffInput.value;
  const noPreference = staffSelection === NO_PREFERENCE_VALUE;
  const service = selectedService();

  selectedTime = '';

  if (!date) {
    availabilityIsEmpty = false;
    timesBox.innerHTML =
      `<div>${customerT('chooseDate')}</div>`;
    return;
  }

  availabilityIsEmpty = false;
  timesBox.innerHTML =
    `<div>${customerT('checking')}</div>`;

  try {

    const url =
      `/api/available-times-db` +
      `?shopSlug=${encodeURIComponent(customerShopSlug)}` +
      `&date=${encodeURIComponent(date)}` +
      `&staffSelectionType=${noPreference ? 'no_preference' : 'specific'}` +
      (noPreference ? '' : `&staffId=${encodeURIComponent(staffSelection)}`) +
      `&serviceId=${encodeURIComponent(service?.id || '')}`;

    const response =
      await fetch(url);

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(
        result.message || customerT('availabilityFailed')
      );
    }

    renderTimes(result.data);

  } catch (error) {

    availabilityIsEmpty = false;
    timesBox.innerHTML =
      `<div class="error">${error.message}</div>`;

  }
}


// 显示时间按钮
function renderTimes(times) {

  timesBox.innerHTML = '';
  availabilityIsEmpty = !times || times.length === 0;

  if (availabilityIsEmpty) {

    timesBox.innerHTML =
      `<div>${customerT('noTimes')}</div>`;

    return;
  }

  times.forEach(time => {

    const button =
      document.createElement('div');

    button.className = 'time-btn';

    button.textContent = time;

    button.onclick = () => {

      document
        .querySelectorAll('.time-btn')
        .forEach(btn =>
          btn.classList.remove('selected')
        );

      button.classList.add('selected');

      selectedTime = time;
    };

    timesBox.appendChild(button);
  });
}


// 提交预约
document
  .getElementById('submitBtn')
  .addEventListener(
    'click',
    async () => {

      const customerName =
        document
          .getElementById('customerName')
          .value
          .trim();

      const phone =
        document
          .getElementById('phone')
          .value
          .trim();

      const email =
        document
          .getElementById('email')
          .value
          .trim();

      const date =
        dateInput.value;

      const staffSelection =
        staffInput.value;
      const noPreference = staffSelection === NO_PREFERENCE_VALUE;

      const service = selectedService();

      if (
        !service ||
        (!noPreference && !staffSelection) ||
        !customerName ||
        !phone ||
        !date ||
        !selectedTime
      ) {

        messageBox.className =
          'message error';

        messageBox.textContent =
          customerT('requiredBookingFields');

        return;
      }

      const submitBtn =
        document.getElementById('submitBtn');

      submitBtn.disabled = true;

      submitBtn.textContent =
        customerT('submitting');

      messageBox.textContent = '';

      try {

        const response =
          await fetch(
            '/api/new-db',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                shopSlug: customerShopSlug,
                serviceId: service.id,
                locale: currentLocale,
                staffSelectionType: noPreference ? 'no_preference' : 'specific',
                ...(noPreference ? {} : { staffId: staffSelection }),
                customerName,
                phone,
                email,
                date,
                time: selectedTime
              })
            }
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message || customerT('bookingFailed')
          );
        }

        messageBox.className =
          'message success';

        messageBox.innerHTML =
          `✅ ${customerT('bookingSuccess')}<br>` +
          `${localeApi.formatDate(date, currentLocale)} ${selectedTime}<br>` +
          `${service.name} · ${staffInput.options[staffInput.selectedIndex].textContent}`;

        // 成功后重新读取时间
        await loadAvailableTimes();

      } catch (error) {

        messageBox.className =
          'message error';

        messageBox.textContent =
          error.message;

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          customerT('bookAppointment');
      }
    }
  );

document.getElementById('languageZh').addEventListener('click', () => setLocale('zh-CN'));
document.getElementById('languageEn').addEventListener('click', () => setLocale('en'));
(async () => {
  try {
    await loadCustomerShopContext();
    await setLocale(currentLocale);
  } catch (error) {
    messageBox.className = 'message error';
    messageBox.textContent = error.message;
  }
})();

</script>

</body>
</html>
