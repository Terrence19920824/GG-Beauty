<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="customerPageTitle">GG-Beauty 在线预约</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "PingFang SC", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .header p {
      color: #777;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .category-card {
      margin: 0;
      min-height: 112px;
      padding: 16px 10px;
      border: 1px solid #ddd;
      background: #fff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .category-card.selected {
      border-color: #111;
      box-shadow: inset 0 0 0 1px #111;
    }

    .category-icon { font-size: 28px; }
    .category-name { font-size: 15px; }
    [hidden] { display: none !important; }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .date-picker {
      position: relative;
    }

    .date-picker-display {
      min-height: 49px;
    }

    .date-picker input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 18px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .time-btn {
      padding: 11px 5px;
      border: 1px solid #ddd;
      border-radius: 9px;
      text-align: center;
      background: white;
      cursor: pointer;
    }

    .time-btn.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      color: green;
    }

    .error {
      color: #c62828;
    }
    .cart-item { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-top: 10px; }
    .cart-item h3 { margin: 0 0 6px; }
    .cart-meta, .cart-total { color: #555; line-height: 1.6; }
    .remove-item { background: #eee; color: #222; margin-top: 8px; padding: 9px; }
    .recipient-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .recipient-option { margin: 0; padding: 13px 10px; background: #fff; color: #222; border: 1px solid #ddd; font-size: 14px; }
    .recipient-option.selected { background: #111; color: #fff; border-color: #111; }
    .phone-row { display: grid; grid-template-columns: 145px 1fr; gap: 8px; }
    .language-switch { display: inline-flex; padding: 3px; border: 1px solid #ddd; border-radius: 999px; background: #fff; }
    .language-switch button { width: auto; margin: 0; padding: 7px 12px; border-radius: 999px; font-size: 13px; }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>GG-Beauty</h1>
    <p data-i18n="onlineAppointment">在线预约</p>
    <div class="language-switch"><button id="languageZh" type="button">中文</button><button id="languageEn" type="button">EN</button></div>
  </div>

  <div id="categoryStep" class="card" hidden>
    <label data-i18n="chooseServiceCategory">选择服务分类</label>
    <div id="categoryGrid" class="category-grid"></div>
  </div>

  <div id="bookingStep" class="card" hidden>

    <label id="serviceLabel" data-i18n="serviceManagement">服务项目</label>
    <select id="service">
      <option value="" data-i18n="loadingCustomerServices">正在读取服务...</option>
    </select>

    <button id="addServiceBtn" type="button" data-i18n="addSelectedService">添加该项目</button>
    <div id="cartPanel" hidden>
      <label data-i18n="selectedServices">已选项目</label>
      <div id="recipientChoice">
        <label data-i18n="bookingRecipient">预约给谁？</label>
        <div class="recipient-options">
          <button id="bookForMyself" class="recipient-option selected" type="button" data-i18n="bookForMyself">为自己预约</button>
          <button id="bookForSomeoneElse" class="recipient-option" type="button" data-i18n="bookForSomeoneElse">为别人预约</button>
        </div>
      </div>
      <div id="recipientFields" hidden>
        <label data-i18n="recipientDetails">服务接收人资料</label>
        <label data-i18n="recipientName">服务接收人姓名</label>
        <input id="recipientName" type="text" data-i18n-placeholder="enterRecipientName" placeholder="请输入服务接收人姓名">
        <label data-i18n="countryRegion">国家 / 地区</label>
        <div class="phone-row">
          <select id="recipientCountryCode" aria-label="Recipient country or region"></select>
          <input id="recipientPhone" type="tel" data-i18n-placeholder="enterPhone" placeholder="请输入手机号码">
        </div>
        <label data-i18n="recipientEmail">服务接收人 Email（选填）</label>
        <input id="recipientEmail" type="email" placeholder="example@email.com">
      </div>
      <div id="cartItems"></div>
      <div id="cartTotals" class="cart-total"></div>
      <button id="addAnotherBtn" type="button" data-i18n="addAnotherService">＋ 继续添加项目</button>
    </div>

    <label data-i18n="appointmentDate">预约日期</label>
    <div class="date-picker">
      <input type="text" id="dateDisplay" class="date-picker-display" readonly aria-hidden="true">
      <input type="date" id="date" aria-label="预约日期">
    </div>

    <label data-i18n="availableTimes">可预约时间</label>

    <div id="times" class="time-grid">
      <div data-i18n="chooseDate">请先选择日期</div>
    </div>

  </div>

  <div id="contactStep" class="card" hidden>

    <label data-i18n="yourDetails">您的联系方式</label>
    <label data-i18n="name">姓名</label>
    <input
      type="text"
      id="customerName"
      placeholder="请输入姓名"
      data-i18n-placeholder="enterName"
    >

    <label data-i18n="countryRegion">国家 / 地区</label>
    <div class="phone-row">
      <select id="bookerCountryCode" aria-label="Country or region"></select>
      <input type="tel" id="phone" placeholder="请输入手机号码" data-i18n-placeholder="enterPhone">
    </div>

    <label data-i18n="optionalEmail">Email（选填）</label>
    <input
      type="email"
      id="email"
      placeholder="example@email.com"
    >

    <div id="confirmationSummary" class="cart-item" hidden></div>

    <button id="submitBtn">
      <span data-i18n="bookAppointment">确认预约</span>
    </button>

    <div id="message" class="message"></div>

  </div>

</div>

<script src="/shared-i18n.js"></script>
<script src="/service-locale.js"></script>
<script src="/customer-shop-context.js"></script>
<script src="/customer-category-flow.js"></script>
<script src="/customer-multi-service-cart.js"></script>
<script>
/* Legacy single-service behavior is preserved server-side. This UI sends the
   canonical multi-item request even when the cart contains one item. */
let selectedSlot = null;
let availabilityIsEmpty = false;
let availableCategories = [];
let availableServices = [];
let customerShopSlug = '';
let selectedCategoryId = '';
let cart = globalThis.ggCustomerMultiServiceCart.create();
let bookingFor = 'myself';
const staffByItem = new Map();
const NO_PREFERENCE_VALUE = '__no_preference__';
const localeApi = globalThis.ggI18n;
const shopContextApi = globalThis.ggCustomerShopContext;
const categoryFlowApi = globalThis.ggCustomerCategoryFlow;
const cartApi = globalThis.ggCustomerMultiServiceCart;
const customerT = key => localeApi.t(key, currentLocale);
const COUNTRY_CODES = [
  ['+65', 'countrySingapore'], ['+60', 'countryMalaysia'], ['+62', 'countryIndonesia'],
  ['+86', 'countryChina'], ['+1', 'countryUnitedStates']
];

function renderCountryOptions(select) {
  const selected = select.value || '+65';
  select.innerHTML = COUNTRY_CODES.map(([code, countryKey]) => `<option value="${code}">${code} ${customerT(countryKey)}</option>`).join('');
  select.value = selected;
}

function explicitContactPhone(countryCode, value) {
  const phone = typeof value === 'string' ? value.trim() : '';
  if (!phone) return '';
  if (phone.startsWith('+') || phone.startsWith('00')) return phone;
  return `${countryCode}${phone}`;
}

function renderRecipientChoice() {
  bookForMyself.classList.toggle('selected', bookingFor === 'myself');
  bookForSomeoneElse.classList.toggle('selected', bookingFor === 'someone_else');
  recipientFields.hidden = bookingFor !== 'someone_else';
}

function initialLocale() {
  return localeApi.getStoredLocale(localStorage, navigator);
}

let currentLocale = initialLocale();

async function loadCustomerShopContext() {
  const candidate = shopContextApi.resolveCandidate(globalThis.location);
  if (!candidate) throw new Error('Missing or invalid shop context');
  const response = await fetch(`/api/booking/context?shopSlug=${encodeURIComponent(candidate)}`);
  const result = await response.json();
  if (!response.ok || result.success === false || !result.data?.shopSlug) {
    throw new Error(result.message || 'Shop is unavailable');
  }
  customerShopSlug = result.data.shopSlug;
}

const selectedService = () => availableServices.find(item => item.id === serviceInput.value) || null;
const serviceById = id => availableServices.find(item => item.id === id);

function renderCategories() {
  const entry = categoryFlowApi.deriveEntryState(availableCategories, selectedCategoryId);
  selectedCategoryId = entry.selectedCategoryId;
  categoryGrid.innerHTML = '';
  categoryStep.hidden = !entry.showCategoryCards;
  bookingStep.hidden = !entry.showBookingStep;
  contactStep.hidden = !entry.showBookingStep;
  for (const category of availableCategories) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `category-card${category.categoryId === selectedCategoryId ? ' selected' : ''}`;
    button.dataset.categoryId = category.categoryId;
    button.innerHTML = `<span class="category-icon" aria-hidden="true">${categoryFlowApi.categoryIcon(category.iconKey)}</span><span class="category-name"></span>`;
    button.querySelector('.category-name').textContent = category.name;
    button.addEventListener('click', () => selectCategory(category.categoryId));
    categoryGrid.appendChild(button);
  }
}

async function selectCategory(categoryId) {
  if (!availableCategories.some(category => category.categoryId === categoryId)) return;
  selectedCategoryId = categoryId;
  renderCategories();
  renderServices();
}

function serviceOptionText(service) {
  return `${service.name} · ${localeApi.formatPrice(service.price, service.priceIsFrom, currentLocale)} · ${localeApi.formatDuration(service.durationMinutes, currentLocale)}`;
}

function renderServices() {
  serviceInput.innerHTML = '';
  const categoryServices = categoryFlowApi.filterServicesByCategory(availableServices, selectedCategoryId);
  for (const service of categoryServices) {
    const option = document.createElement('option');
    option.value = service.id;
    option.textContent = serviceOptionText(service);
    serviceInput.appendChild(option);
  }
  if (!categoryServices.length) {
    const option = document.createElement('option');
    option.value = '';
    option.textContent = customerT('noCustomerServices');
    serviceInput.appendChild(option);
  }
}

async function loadServices() {
  if (!customerShopSlug) return;
  const response = await fetch(`/api/services-db?shopSlug=${encodeURIComponent(customerShopSlug)}&locale=${encodeURIComponent(currentLocale)}`);
  const result = await response.json();
  if (!response.ok || result.success === false) throw new Error(result.message || customerT('noCustomerServices'));
  availableServices = result.data || [];
  renderServices();
  await renderCart();
}

async function loadCategories() {
  const response = await fetch(`/api/booking/service-categories?shopSlug=${encodeURIComponent(customerShopSlug)}&locale=${encodeURIComponent(currentLocale)}`);
  const result = await response.json();
  if (!response.ok || result.success === false) throw new Error(result.message || customerT('noCustomerServices'));
  availableCategories = result.data || [];
  renderCategories();
  if (!availableCategories.length) {
    bookingStep.hidden = true;
    messageBox.className = 'message';
    messageBox.textContent = customerT('noCustomerServices');
  } else {
    messageBox.textContent = '';
  }
}

async function loadCustomerCatalogue() {
  await loadCategories();
  await loadServices();
}

async function staffFor(item) {
  if (staffByItem.has(item.clientItemKey)) return staffByItem.get(item.clientItemKey);
  const response = await fetch(`/api/booking/staff-options?shopSlug=${encodeURIComponent(customerShopSlug)}&serviceId=${encodeURIComponent(item.serviceId)}`);
  const result = await response.json();
  if (!response.ok || result.success === false) throw new Error(result.message || customerT('customerStaffNone'));
  staffByItem.set(item.clientItemKey, result.data || []);
  return result.data || [];
}

async function renderCart() {
  cartPanel.hidden = cart.length === 0;
  cartItems.innerHTML = '';
  for (const item of cart) {
    const service = serviceById(item.serviceId); if (!service) continue;
    const members = await staffFor(item);
    const card = document.createElement('div'); card.className = 'cart-item'; card.dataset.itemKey = item.clientItemKey;
    const heading = document.createElement('h3'); heading.textContent = service.name; card.appendChild(heading);
    const meta = document.createElement('div'); meta.className = 'cart-meta'; meta.textContent = `${localeApi.formatDuration(service.durationMinutes,currentLocale)} · ${localeApi.formatPrice(service.price,service.priceIsFrom,currentLocale)}`; card.appendChild(meta);
    const label = document.createElement('label'); label.textContent = customerT('chooseStaffCustomer'); card.appendChild(label);
    const select = document.createElement('select');
    select.innerHTML = `<option value="${NO_PREFERENCE_VALUE}">${customerT('customerStaffNoPreference')}</option>` + members.map(member => `<option value="${member.staffId}">${member.displayName}</option>`).join('');
    select.value = item.staffSelectionType === 'specific' ? item.staffId : NO_PREFERENCE_VALUE;
    select.addEventListener('change', () => { cart = cartApi.updateStaff(cart,item.clientItemKey,select.value===NO_PREFERENCE_VALUE?'no_preference':'specific',select.value); clearStaleTime(); });
    card.appendChild(select);
    const remove = document.createElement('button'); remove.type='button'; remove.className='remove-item'; remove.textContent=customerT('removeService');
    remove.addEventListener('click', async()=>{cart=cartApi.remove(cart,item.clientItemKey);staffByItem.delete(item.clientItemKey);clearStaleTime();await renderCart();}); card.appendChild(remove);
    cartItems.appendChild(card);
  }
  const total=cartApi.totals(cart,availableServices);
  cartTotals.textContent=`${customerT('totalDuration')}: ${localeApi.formatDuration(total.durationMinutes,currentLocale)} · ${customerT('estimatedTotal')}: ${localeApi.formatPrice(total.listedPrice,total.priceIsFrom,currentLocale)}`;
  contactStep.hidden = cart.length === 0;
}

function clearStaleTime(){selectedSlot=null;availabilityIsEmpty=false;confirmationSummary.hidden=true;timesBox.innerHTML=`<div>${customerT('chooseDate')}</div>`;}

function renderLocaleDependentBookingState() {
  if (!dateInput.value) {
    timesBox.innerHTML = `<div>${customerT('chooseDate')}</div>`;
  } else if (availabilityIsEmpty) {
    renderTimes([]);
  } else if (selectedSlot) {
    renderConfirmation();
  }
}

async function setLocale(locale) {
  currentLocale = localeApi.setLocale(locale, localStorage);
  document.documentElement.lang = currentLocale;
  document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = customerT(element.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = customerT(element.dataset.i18nPlaceholder); });
  document.getElementById('languageZh').disabled = currentLocale === 'zh-CN';
  document.getElementById('languageEn').disabled = currentLocale === 'en';
  renderCountryOptions(bookerCountryCode);
  renderCountryOptions(recipientCountryCode);
  renderRecipientChoice();
  dateInput.lang = currentLocale;
  renderSelectedDate();
  renderLocaleDependentBookingState();
  await renderCart();
  try { await loadCustomerCatalogue(); } catch (error) { messageBox.textContent = error.message; }
  renderLocaleDependentBookingState();
}

const dateInput =
  document.getElementById('date');

const dateDisplay =
  document.getElementById('dateDisplay');

const serviceInput =
  document.getElementById('service');

const categoryStep = document.getElementById('categoryStep');
const categoryGrid = document.getElementById('categoryGrid');
const bookingStep = document.getElementById('bookingStep');
const contactStep = document.getElementById('contactStep');
const cartPanel=document.getElementById('cartPanel'),cartItems=document.getElementById('cartItems'),cartTotals=document.getElementById('cartTotals');

const timesBox =
  document.getElementById('times');

const messageBox =
  document.getElementById('message');

const confirmationSummary = document.getElementById('confirmationSummary');
const bookForMyself = document.getElementById('bookForMyself');
const bookForSomeoneElse = document.getElementById('bookForSomeoneElse');
const recipientFields = document.getElementById('recipientFields');
const bookerCountryCode = document.getElementById('bookerCountryCode');
const recipientCountryCode = document.getElementById('recipientCountryCode');
renderCountryOptions(bookerCountryCode);
renderCountryOptions(recipientCountryCode);


// 不允许选择过去日期
const today =
  new Date().toISOString().split('T')[0];

dateInput.min = today;

function renderSelectedDate() {
  dateDisplay.value = localeApi.formatDate(dateInput.value, currentLocale);
}


// 日期 / 员工 / 项目变化时重新读取时间
dateInput.addEventListener(
  'change',
  () => {
    renderSelectedDate();
    loadAvailableTimes();
  }
);

serviceInput.addEventListener(
  'change',
  clearStaleTime
);

document.getElementById('addServiceBtn').addEventListener('click',async()=>{const service=selectedService();if(!service)return;cart=cartApi.add(cart,service);clearStaleTime();await renderCart();});
document.getElementById('addAnotherBtn').addEventListener('click',()=>{selectedCategoryId='';categoryStep.hidden=false;categoryStep.scrollIntoView({behavior:'smooth'});});
bookForMyself.addEventListener('click', () => { bookingFor = 'myself'; renderRecipientChoice(); });
bookForSomeoneElse.addEventListener('click', () => { bookingFor = 'someone_else'; renderRecipientChoice(); });


// 获取数据库可预约时间
async function loadAvailableTimes() {

  const date = dateInput.value;
  selectedSlot = null;
  availabilityIsEmpty = false;
  confirmationSummary.hidden = true;

  if (!date) {
    timesBox.innerHTML =
      `<div>${customerT('chooseDate')}</div>`;
    return;
  }

  timesBox.innerHTML =
    `<div>${customerT('checking')}</div>`;

  try {

    if (!cart.length) return;
    const response = await fetch('/api/booking/multi-service-available-times',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shopSlug:customerShopSlug,date,locale:currentLocale,items:cartApi.requestItems(cart)})});

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(
        result.message || customerT('availabilityFailed')
      );
    }

    renderTimes(result.data);

  } catch (error) {

    timesBox.innerHTML =
      `<div class="error">${error.message}</div>`;

  }
}


// 显示时间按钮
function renderTimes(times) {

  timesBox.innerHTML = '';
  availabilityIsEmpty = !times || times.length === 0;
  if (!times || times.length === 0) {

    timesBox.innerHTML =
      `<div>${customerT('noTimes')}</div>`;

    return;
  }

  times.forEach(slot => {

    const button =
      document.createElement('div');

    button.className = 'time-btn';

    button.textContent = slot.time;

    button.onclick = () => {

      document
        .querySelectorAll('.time-btn')
        .forEach(btn =>
          btn.classList.remove('selected')
        );

      button.classList.add('selected');

      selectedSlot = slot;
      renderConfirmation();
    };

    timesBox.appendChild(button);
  });
}

function renderConfirmation() {
  confirmationSummary.innerHTML = '';
  confirmationSummary.hidden = !selectedSlot || !cart.length;
  if (confirmationSummary.hidden) return;
  let cursor = new Date(selectedSlot.startAt).getTime();
  for (const item of cart) {
    const service = serviceById(item.serviceId);
    if (!service) continue;
    const start = new Date(cursor);
    cursor += Number(service.durationMinutes) * 60000;
    const end = new Date(cursor);
    const row = document.createElement('div');
    row.className = 'cart-meta';
    const staff = item.staffSelectionType === 'specific'
      ? (staffByItem.get(item.clientItemKey) || []).find(member => member.staffId === item.staffId)?.displayName
      : customerT('customerStaffNoPreference');
    row.textContent = `${service.name} · ${start.toLocaleTimeString(currentLocale, {hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Singapore'})}–${end.toLocaleTimeString(currentLocale, {hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Singapore'})} · ${staff || customerT('customerStaffNoPreference')} · ${localeApi.formatPrice(service.price,service.priceIsFrom,currentLocale)}`;
    confirmationSummary.appendChild(row);
  }
  const total = cartApi.totals(cart, availableServices);
  const summary = document.createElement('strong');
  summary.textContent = `${customerT('totalDuration')}: ${localeApi.formatDuration(total.durationMinutes,currentLocale)} · ${customerT('estimatedTotal')}: ${localeApi.formatPrice(total.listedPrice,total.priceIsFrom,currentLocale)}`;
  confirmationSummary.appendChild(summary);
}


// 提交预约
document
  .getElementById('submitBtn')
  .addEventListener(
    'click',
    async () => {

      const customerName =
        document
          .getElementById('customerName')
          .value
          .trim();

      const phone = explicitContactPhone(
        bookerCountryCode.value,
        document
          .getElementById('phone')
          .value
      );

      const email =
        document
          .getElementById('email')
          .value
          .trim();

      const date =
        dateInput.value;

      const recipient = bookingFor === 'someone_else' ? {
        name: document.getElementById('recipientName').value.trim(),
        phone: explicitContactPhone(recipientCountryCode.value, document.getElementById('recipientPhone').value),
        email: document.getElementById('recipientEmail').value.trim()
      } : null;

      if (
        !cart.length ||
        !customerName ||
        !phone ||
        (bookingFor === 'someone_else' && (!recipient.name || !recipient.phone)) ||
        !date ||
        !selectedSlot
      ) {

        messageBox.className =
          'message error';

        messageBox.textContent =
          customerT('requiredBookingFields');

        return;
      }

      const submitBtn =
        document.getElementById('submitBtn');

      submitBtn.disabled = true;

      submitBtn.textContent =
        customerT('submitting');

      messageBox.textContent = '';

      try {

        const response =
          await fetch(
            '/api/new-db',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                shopSlug: customerShopSlug,
                items: cartApi.requestItems(cart),
                locale: currentLocale,
                customerName,
                phone,
                email,
                bookingFor,
                ...(recipient ? { recipient } : {}),
                date,
                startAt: selectedSlot.startAt
              })
            }
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message || customerT('bookingFailed')
          );
        }

        messageBox.className =
          'message success';

        messageBox.innerHTML =
          `✅ ${customerT('bookingSuccess')}<br>` +
          `${localeApi.formatDate(date, currentLocale)} ${selectedSlot.time}<br>` +
          cart.map(item=>serviceById(item.serviceId)?.name).join(' · ');

        // 成功后重新读取时间
        await loadAvailableTimes();

      } catch (error) {

        messageBox.className =
          'message error';

        messageBox.textContent =
          error.message;

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          customerT('bookAppointment');
      }
    }
  );

document.getElementById('languageZh').addEventListener('click', () => setLocale('zh-CN'));
document.getElementById('languageEn').addEventListener('click', () => setLocale('en'));
(async () => {
  try {
    await loadCustomerShopContext();
    await setLocale(currentLocale);
  } catch (error) {
    messageBox.className = 'message error';
    messageBox.textContent = error.message;
  }
})();

</script>
