<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="color-scheme" content="light">
  <title>My Appointments</title>
  <style>
    :root {
      --background: #f5f6f8;
      --surface: #ffffff;
      --text: #172027;
      --muted: #68737d;
      --line: #e6e9ec;
      --accent: #1f6f68;
      --accent-soft: #e8f4f2;
      --danger: #a83d3d;
      --shadow: 0 7px 24px rgba(24, 36, 43, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 7vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .language-switch {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .language-switch button {
      min-width: 26px;
      padding: 2px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: inherit;
    }

    .language-switch button.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .identity {
      min-height: 54px;
      margin-top: 20px;
    }

    .identity-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .staff-name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .location-name {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .view-switch {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding-bottom: 2px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .view-switch button {
      min-width: 28px;
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: inherit;
    }

    .view-switch button.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 750;
    }

    .date-panel {
      margin-top: 22px;
    }

    .quick-dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .date-button,
    .action-button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      font-weight: 650;
    }

    .date-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .date-picker-row {
      position: relative;
      margin-top: 9px;
    }

    .calendar-navigation {
      display: none;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .calendar-navigation.visible {
      display: grid;
    }

    .calendar-nav-button {
      width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 1.15rem;
    }

    .calendar-date-summary {
      min-width: 0;
      text-align: center;
    }

    .calendar-date-summary p {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 750;
    }

    .calendar-today-button {
      margin-top: 3px;
      padding: 2px 10px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .date-picker-label {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    #date-picker {
      width: 138px;
      min-height: 36px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      text-align: right;
    }

    .list-heading {
      display: flex;
      min-height: 28px;
      align-items: center;
      justify-content: space-between;
      margin: 25px 2px 12px;
    }

    .selected-date {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .loading-label {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .appointment-list {
      display: grid;
      gap: 12px;
    }

    .calendar-view {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .calendar-staff-header {
      position: sticky;
      top: 0;
      z-index: 4;
      min-height: 50px;
      padding: 15px 14px 12px 66px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      font-size: 0.84rem;
      font-weight: 750;
      backdrop-filter: blur(8px);
    }

    .calendar-scroll {
      max-height: min(68vh, 760px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .timeline {
      --minute-height: 1.25px;
      position: relative;
      min-height: 900px;
      margin-left: 58px;
      border-left: 1px solid var(--line);
    }

    .time-line {
      position: absolute;
      right: 0;
      left: 0;
      height: 1px;
      background: #edf0f2;
      pointer-events: none;
    }

    .time-line.half-hour {
      background: #f4f5f6;
    }

    .time-label {
      position: absolute;
      right: calc(100% + 9px);
      width: 48px;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .calendar-empty-note {
      position: absolute;
      top: 20px;
      right: 12px;
      left: 12px;
      z-index: 1;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(245, 246, 248, 0.92);
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
      pointer-events: none;
    }

    .calendar-appointment {
      position: absolute;
      right: 8px;
      left: 8px;
      z-index: 2;
      min-height: 44px;
      overflow: hidden;
      padding: 8px 10px;
      border: 0;
      border-left: 3px solid #8c9aa5;
      border-radius: 9px;
      background: #eef1f3;
      color: var(--text);
      text-align: left;
      box-shadow: 0 4px 12px rgba(31, 48, 58, 0.08);
    }

    .calendar-appointment.status-pending {
      border-left-color: #c69a3a;
      background: #fff5df;
    }

    .calendar-appointment.status-confirmed {
      border-left-color: var(--accent);
      background: #e5f3f1;
    }

    .calendar-appointment.status-completed {
      border-left-color: #84919a;
      background: #eceff1;
    }

    .calendar-appointment.status-cancelled {
      border-left-color: #b86a6a;
      background: #f9eaea;
      opacity: 0.78;
    }

    .calendar-appointment-time,
    .calendar-appointment-name,
    .calendar-appointment-service,
    .calendar-appointment-phone {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-appointment-time {
      font-size: 0.72rem;
      font-weight: 800;
    }

    .calendar-appointment-name {
      margin-top: 3px;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .calendar-appointment-service,
    .calendar-appointment-phone {
      margin-top: 2px;
      color: #56636b;
      font-size: 0.7rem;
    }

    .appointment-card {
      padding: 18px;
      border: 1px solid rgba(230, 233, 236, 0.82);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .appointment-time {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef0f2;
      color: #59636b;
      font-size: 0.72rem;
      font-weight: 750;
    }

    .status-pending {
      background: #fff3d8;
      color: #8a6413;
    }

    .status-confirmed {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status-completed {
      background: #eceff1;
      color: #56616a;
    }

    .status-cancelled {
      background: #fbe9e9;
      color: var(--danger);
    }

    .customer-name {
      margin: 20px 0 0;
      font-size: 1.06rem;
      font-weight: 720;
    }

    .customer-phone {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    .service-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .service-name {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 650;
    }

    .duration {
      flex: 0 0 auto;
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .state-panel {
      padding: 42px 24px;
      border: 1px dashed #d9dde1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
    }

    .state-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .action-button {
      margin-top: 18px;
      padding: 0 22px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .skeleton {
      min-height: 158px;
      background:
        linear-gradient(
          100deg,
          #ffffff 30%,
          #f1f3f4 50%,
          #ffffff 70%
        );
      background-size: 220% 100%;
      animation: loading 1.25s ease-in-out infinite;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: rgba(16, 24, 28, 0.42);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .appointment-sheet {
      width: min(100%, 520px);
      padding: 22px;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(13, 23, 29, 0.24);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      margin: -8px auto 18px;
      border-radius: 99px;
      background: #d8dde0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-time {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 780;
    }

    .sheet-customer {
      margin: 22px 0 0;
      font-size: 1.1rem;
      font-weight: 750;
    }

    .sheet-phone {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .sheet-detail {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .sheet-service,
    .sheet-duration {
      margin: 0;
      font-size: 0.9rem;
    }

    .sheet-service {
      font-weight: 680;
    }

    .sheet-duration {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .sheet-close {
      width: 100%;
      min-height: 46px;
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }

    .sheet-change-time {
      width: 100%;
      min-height: 46px;
      margin-top: 24px;
      border: 1px solid var(--accent);
      border-radius: 13px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .sheet-change-time[hidden],
    .move-time-panel[hidden] {
      display: none;
    }

    .move-time-panel {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .move-current-grid,
    .move-input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .move-current-grid {
      grid-template-columns: 1.4fr 1fr 1fr;
    }

    .move-field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
    }

    .move-field-value {
      margin: 0;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .move-input-grid {
      margin-top: 18px;
    }

    .move-input {
      width: 100%;
      min-height: 43px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }

    .move-preview {
      margin: 16px 0 0;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--background);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .move-preview strong {
      color: var(--text);
    }

    .move-confirmation {
      min-height: 22px;
      margin: 16px 0 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .move-error {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--danger);
      font-size: 0.8rem;
    }

    .move-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .move-action {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }

    .move-action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .move-action:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .toast {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      z-index: 30;
      max-width: calc(100% - 36px);
      padding: 11px 16px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #21332f;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .toast[hidden] {
      display: none;
    }

    @keyframes loading {
      to {
        background-position-x: -220%;
      }
    }

    @media (min-width: 600px) {
      .app-shell {
        padding-right: 24px;
        padding-left: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header>
      <div class="top-row">
        <h1 id="page-title">My Appointments</h1>
        <nav
          class="language-switch"
          aria-label="Language"
        >
          <button id="language-en" type="button">EN</button>
          <span aria-hidden="true">|</span>
          <button id="language-zh" type="button">中文</button>
        </nav>
      </div>

      <section class="identity-row">
        <div class="identity" aria-live="polite">
          <p id="staff-name" class="staff-name"></p>
          <p id="location-name" class="location-name"></p>
        </div>
        <nav class="view-switch" aria-label="View">
          <button id="view-calendar" type="button">Calendar</button>
          <span aria-hidden="true">|</span>
          <button id="view-list" type="button">List</button>
        </nav>
      </section>
    </header>

    <section class="date-panel" aria-label="Appointment date">
      <div class="quick-dates">
        <button
          id="today-button"
          class="date-button active"
          type="button"
        >
          Today
        </button>
        <button
          id="tomorrow-button"
          class="date-button"
          type="button"
        >
          Tomorrow
        </button>
      </div>

      <div class="date-picker-row">
        <label class="date-picker-label" for="date-picker">
          <span id="date-picker-text">Select Date</span>
          <input id="date-picker" type="date">
        </label>
      </div>

      <div id="calendar-navigation" class="calendar-navigation">
        <button
          id="previous-day"
          class="calendar-nav-button"
          type="button"
          aria-label="Previous day"
        >
          ‹
        </button>
        <div class="calendar-date-summary">
          <p id="calendar-date"></p>
          <button
            id="calendar-today"
            class="calendar-today-button"
            type="button"
          >
            Today
          </button>
        </div>
        <button
          id="next-day"
          class="calendar-nav-button"
          type="button"
          aria-label="Next day"
        >
          ›
        </button>
      </div>
    </section>

    <section aria-live="polite" aria-busy="true" id="appointments-section">
      <div class="list-heading">
        <p id="selected-date" class="selected-date"></p>
        <span id="loading-label" class="loading-label">Loading…</span>
      </div>
      <div id="appointment-list" class="appointment-list">
        <div class="appointment-card skeleton"></div>
        <div class="appointment-card skeleton"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="appointment-modal" class="modal-backdrop" hidden>
    <section
      class="appointment-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-customer"
    >
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <p id="sheet-time" class="sheet-time"></p>
        <span id="sheet-status" class="status-badge"></span>
      </div>
      <p id="sheet-customer" class="sheet-customer"></p>
      <p id="sheet-phone" class="sheet-phone"></p>
      <div class="sheet-detail">
        <p id="sheet-service" class="sheet-service"></p>
        <p id="sheet-duration" class="sheet-duration"></p>
      </div>
      <button
        id="sheet-change-time"
        class="sheet-change-time"
        type="button"
        hidden
      >
        Change Time
      </button>
      <div id="move-time-panel" class="move-time-panel" hidden>
        <div class="move-current-grid">
          <div>
            <span id="current-date-label" class="move-field-label"></span>
            <p id="current-date-value" class="move-field-value"></p>
          </div>
          <div>
            <span id="current-start-label" class="move-field-label"></span>
            <p id="current-start-value" class="move-field-value"></p>
          </div>
          <div>
            <span id="current-end-label" class="move-field-label"></span>
            <p id="current-end-value" class="move-field-value"></p>
          </div>
        </div>
        <div class="move-input-grid">
          <label>
            <span id="new-date-label" class="move-field-label"></span>
            <input id="move-date" class="move-input" type="date">
          </label>
          <label>
            <span id="new-start-label" class="move-field-label"></span>
            <input id="move-start-time" class="move-input" type="time">
          </label>
        </div>
        <p class="move-preview">
          <span id="new-end-label"></span>
          <strong id="new-end-value"></strong>
        </p>
        <p id="move-confirmation" class="move-confirmation"></p>
        <p id="move-error" class="move-error" aria-live="polite"></p>
        <div class="move-actions">
          <button id="move-cancel" class="move-action" type="button"></button>
          <button
            id="move-confirm"
            class="move-action primary"
            type="button"
          ></button>
        </div>
      </div>
      <button id="sheet-close" class="sheet-close" type="button">
        Close
      </button>
    </section>
  </div>

  <script>
    const LANGUAGE_STORAGE_KEY =
      'gg_beauty_staff_language';
    const VIEW_STORAGE_KEY =
      'gg_beauty_staff_appointments_view';
    const CALENDAR_START_MINUTES = 9 * 60;
    const CALENDAR_END_MINUTES = 21 * 60;
    const CALENDAR_MINUTE_HEIGHT = 1.25;

    const translations = {
      en: {
        pageTitle: 'My Appointments',
        today: 'Today',
        tomorrow: 'Tomorrow',
        selectDate: 'Select Date',
        list: 'List',
        calendar: 'Calendar',
        previousDay: 'Previous day',
        nextDay: 'Next day',
        noAppointments: 'No appointments',
        loading: 'Loading…',
        minutes: 'min',
        noAppointmentsToday: 'No appointments today',
        noAppointmentsDate: 'No appointments on this date',
        sessionExpired: 'Session expired. Please log in again.',

    const getSavedLanguage = () => {

      }

      const browserLanguages = Array.isArray(navigator.languages)
        ? navigator.languages
        : [navigator.language];

      return browserLanguages.some(language =>

        language.toLowerCase().startsWith('zh')
      )

    };

    const currentText = () => translations[state.language];

    const addDays = (dateString, numberOfDays) => {
      const date = new Date(`${dateString}T00:00:00.000Z`);
      date.setUTCDate(date.getUTCDate() + numberOfDays);
      return date.toISOString().slice(0, 10);
    };

    const formatDate = dateString => {
      if (!dateString) {
        return '';
      }

      return new Intl.DateTimeFormat(
        state.language === 'zh' ? 'zh-CN' : 'en-SG',
        {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          timeZone: 'UTC'
        }
      ).format(new Date(`${dateString}T00:00:00.000Z`));
    };

    const formatTime = timestamp =>
      new Intl.DateTimeFormat(
        state.language === 'zh' ? 'zh-CN' : 'en-SG',
        {
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23',
          timeZone: state.timezone
        }
      ).format(new Date(timestamp));

    const formatCalendarDate = dateString => {
      if (!dateString) {
        return '';
      }

      return new Intl.DateTimeFormat(
        state.language === 'zh' ? 'zh-CN' : 'en-SG',
        {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          timeZone: 'UTC'
        }
      ).format(new Date(`${dateString}T00:00:00.000Z`));
    };

    const minutesInLocation = timestamp => {
      const parts = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23',
        timeZone: state.timezone
      }).formatToParts(new Date(timestamp));

      const hour = Number(
        parts.find(part => part.type === 'hour').value
      );
      const minute = Number(
        parts.find(part => part.type === 'minute').value
      );

      return hour * 60 + minute;
    };

    const dateTimeInLocation = timestamp => {
      const parts = new Intl.DateTimeFormat('en-CA', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23',
        timeZone: state.timezone
      }).formatToParts(new Date(timestamp));
      const value = type =>
        parts.find(part => part.type === type).value;

      return {
        year: value('year'),
        month: value('month'),
        day: value('day'),
        hour: value('hour'),
        minute: value('minute'),
        second: value('second'),
        date: `${value('year')}-${value('month')}-${value('day')}`,
        time: `${value('hour')}:${value('minute')}`
      };
    };

    const buildZonedStartAt = (dateValue, timeValue) => {
      const dateMatch = typeof dateValue === 'string'
        ? dateValue.match(/^(\d{4})-(\d{2})-(\d{2})$/)
        : null;
      const timeMatch = typeof timeValue === 'string'
        ? timeValue.match(/^(\d{2}):(\d{2})$/)
        : null;

      if (!dateMatch || !timeMatch) {
        return null;
      }

      const year = Number(dateMatch[1]);
      const month = Number(dateMatch[2]);
      const day = Number(dateMatch[3]);
      const hour = Number(timeMatch[1]);
      const minute = Number(timeMatch[2]);
      const wallTime = Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        0
      );
      const calendarCheck = new Date(
        Date.UTC(year, month - 1, day)
      );

      if (
        calendarCheck.getUTCFullYear() !== year ||
        calendarCheck.getUTCMonth() !== month - 1 ||
        calendarCheck.getUTCDate() !== day ||
        hour > 23 ||
        minute > 59
      ) {
        return null;
      }

      let instant = wallTime;

      try {
        for (let attempt = 0; attempt < 3; attempt += 1) {
          const locationParts = dateTimeInLocation(instant);
          const displayedTime = Date.UTC(
            Number(locationParts.year),
            Number(locationParts.month) - 1,
            Number(locationParts.day),
            Number(locationParts.hour),
            Number(locationParts.minute),
            Number(locationParts.second)
          );
          instant = wallTime - (displayedTime - instant);
        }

        const verified = dateTimeInLocation(instant);

        if (
          verified.date !== dateValue ||
          verified.time !== timeValue ||
          verified.second !== '00'
        ) {
          return null;
        }
      } catch (_error) {
        return null;
      }

      const offsetMinutes = Math.round(
        (wallTime - instant) / 60000
      );
      const offsetSign = offsetMinutes >= 0 ? '+' : '-';
      const absoluteOffset = Math.abs(offsetMinutes);
      const offsetHours = String(
        Math.floor(absoluteOffset / 60)
      ).padStart(2, '0');
      const offsetRemainder = String(
        absoluteOffset % 60
      ).padStart(2, '0');

      return `${dateValue}T${timeValue}:00${offsetSign}${offsetHours}:${offsetRemainder}`;
    };

    const normalizeStatus = status => {
      const normalized = typeof status === 'string'
        ? status.toLowerCase()
        : '';

      return Object.prototype.hasOwnProperty.call(
        currentText().statuses,
        normalized
      )
        ? normalized
        : 'unknown';
    };

    const createTextElement = (tagName, className, text) => {
      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      return element;

      const card = document.createElement('article');

      const cardTop = document.createElement('div');
      cardTop.className = 'card-top';

      cardTop.appendChild(

        currentText().statuses[normalizedStatus] ||

      serviceRow.appendChild(

      serviceRow.appendChild(
        createTextElement(
          'p',
          'duration',

      card.appendChild(serviceRow);

      return card;
    };

    let toastTimer;

    const showToast = message => {
      window.clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.hidden = false;
      toastTimer = window.setTimeout(() => {
        elements.toast.hidden = true;
      }, 2600);
    };

    const canMoveAppointments = () =>
      state.profile &&
      state.profile.permissions &&
      state.profile.permissions
        .can_move_own_appointments === true;

    const closeMoveTimePanel = () => {
      elements.moveTimePanel.hidden = true;
      elements.moveError.textContent = '';
      elements.sheetChangeTime.hidden =
        !canMoveAppointments();
    };

    const closeAppointmentSheet = () => {
      closeMoveTimePanel();
      elements.appointmentModal.hidden = true;
      state.activeAppointment = null;
      document.body.style.overflow = '';
    };

    const updateMovePreview = () => {
      const appointment = state.activeAppointment;
      const newStartAt = buildZonedStartAt(
        elements.moveDate.value,
        elements.moveStartTime.value
      );
      const duration = appointment
        ? new Date(appointment.endAt).getTime() -
          new Date(appointment.startAt).getTime()
        : 0;

      elements.moveError.textContent = '';

      if (!newStartAt || duration <= 0) {
        elements.newEndValue.textContent = '—';
        elements.moveConfirmation.textContent = '';
        elements.moveConfirm.disabled = true;
        return null;
      }

      const newEndAt = new Date(
        new Date(newStartAt).getTime() + duration
      );
      const startText = formatTime(newStartAt);
      const endText = formatTime(newEndAt);

      elements.newEndValue.textContent = endText;
      elements.moveConfirmation.textContent =
        currentText().moveConfirmation(startText, endText);
      elements.moveConfirm.disabled = state.moveSubmitting;

      return newStartAt;
    };

    const openMoveTimePanel = () => {
      if (
        !canMoveAppointments() ||
        !state.activeAppointment
      ) {
        return;
      }

      const appointment = state.activeAppointment;
      const start = dateTimeInLocation(appointment.startAt);
      const end = dateTimeInLocation(appointment.endAt);
      const text = currentText();

      elements.currentDateLabel.textContent = text.currentDate;
      elements.currentStartLabel.textContent = text.currentStart;
      elements.currentEndLabel.textContent = text.currentEnd;
      elements.newDateLabel.textContent = text.newDate;
      elements.newStartLabel.textContent = text.newStart;
      elements.newEndLabel.textContent = `${text.newEnd}: `;
      elements.moveCancel.textContent = text.cancel;
      elements.moveConfirm.textContent = text.confirm;
      elements.currentDateValue.textContent = start.date;
      elements.currentStartValue.textContent = start.time;
      elements.currentEndValue.textContent = end.time;
      elements.moveDate.value = start.date;
      elements.moveStartTime.value = start.time;
      elements.moveError.textContent = '';
      elements.sheetChangeTime.hidden = true;
      elements.moveTimePanel.hidden = false;
      updateMovePreview();
      elements.moveStartTime.focus();
    };

    const submitAppointmentMove = async () => {
      if (
        state.moveSubmitting ||
        !canMoveAppointments() ||
        !state.activeAppointment
      ) {
        return;
      }

      const newStartAt = updateMovePreview();

      if (!newStartAt) {
        elements.moveError.textContent =
          currentText().unableToMove;
        return;
      }

      state.moveSubmitting = true;
      elements.moveConfirm.disabled = true;
      elements.moveError.textContent = '';

      try {
        const response = await fetch(
          `/api/staff/appointments/${encodeURIComponent(state.activeAppointment.id)}/time`,
          {
            method: 'PATCH',
            credentials: 'same-origin',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ newStartAt })
          }
        );

        if (response.status === 401) {
          closeAppointmentSheet();
          state.view = 'session';
          state.loading = false;
          render();
          return;
        }

        if (response.status === 409) {
          elements.moveError.textContent =
            currentText().timeUnavailable;
          return;
        }

        if (response.status === 403) {
          elements.moveError.textContent =
            currentText().notAllowed;
          return;
        }

        if (!response.ok) {
          elements.moveError.textContent =
            currentText().unableToMove;
          return;
        }

        const payload = await response.json();

        if (!payload.success) {
          elements.moveError.textContent =
            currentText().unableToMove;
          return;
        }

        const queryDate = state.selectionMode === 'today'
          ? null
          : state.selectedDate;

        closeAppointmentSheet();
        await loadAppointments(queryDate);
        showToast(currentText().appointmentMoved);
      } catch (_error) {
        elements.moveError.textContent =
          currentText().unableToMove;
      } finally {
        state.moveSubmitting = false;

        if (!elements.moveTimePanel.hidden) {
          updateMovePreview();
        }
      }
    };

    const openAppointmentSheet = appointment => {
      const normalizedStatus = normalizeStatus(appointment.status);
      const statusText =
        currentText().statuses[normalizedStatus] ||
        currentText().unknownStatus;

      elements.sheetTime.textContent =
        `${formatTime(appointment.startAt)} – ${formatTime(appointment.endAt)}`;
      elements.sheetStatus.className =
        `status-badge status-${normalizedStatus}`;

      elements.sheetCustomer.textContent =

      elements.sheetPhone.textContent =
        appointment.customerPhone || '—';

        appointment.serviceName || '—';

      elements.moveTimePanel.hidden = true;
      elements.moveError.textContent = '';

        currentText().changeTime;

        !canMoveAppointments();

      document.body.style.overflow = 'hidden';

    const renderCalendar = () => {
      const calendar = document.createElement('div');
      calendar.className = 'calendar-view';

      const staffHeader = createTextElement(
        'div',
        'calendar-staff-header',
        state.profile ? state.profile.name : ''
      );
      calendar.appendChild(staffHeader);

      const scroll = document.createElement('div');
      scroll.className = 'calendar-scroll';
      const timeline = document.createElement('div');
      timeline.className = 'timeline';

      for (
        let minutes = CALENDAR_START_MINUTES;
        minutes <= CALENDAR_END_MINUTES;
        minutes += 30
      ) {
        const offset =
          (minutes - CALENDAR_START_MINUTES) *
          CALENDAR_MINUTE_HEIGHT;
        const line = document.createElement('div');
        line.className = minutes % 60 === 0
          ? 'time-line'
          : 'time-line half-hour';
        line.style.top = `${offset}px`;

        const hour = String(Math.floor(minutes / 60)).padStart(2, '0');
        const minute = String(minutes % 60).padStart(2, '0');
        const label = createTextElement(
          'span',
          'time-label',
          `${hour}:${minute}`
        );
        line.appendChild(label);

        timeline.appendChild(line);
      }

      let visibleAppointmentCount = 0;

      state.appointments.forEach(appointment => {
        const startMinutes = minutesInLocation(appointment.startAt);
        const appointmentSpanMinutes = Math.max(
          1,
          (
            new Date(appointment.endAt).getTime() -
            new Date(appointment.startAt).getTime()
          ) / 60000
        );
        const endMinutes = startMinutes + appointmentSpanMinutes;

        if (
          endMinutes <= CALENDAR_START_MINUTES ||
          startMinutes >= CALENDAR_END_MINUTES
        ) {
          return;
        }

        visibleAppointmentCount += 1;

        const visibleStart = Math.max(
          startMinutes,
          CALENDAR_START_MINUTES
        );
        const visibleEnd = Math.min(
          endMinutes,
          CALENDAR_END_MINUTES
        );
        const top =
          (visibleStart - CALENDAR_START_MINUTES) *
          CALENDAR_MINUTE_HEIGHT;
        const height = Math.max(
          44,
          (visibleEnd - visibleStart) *
            CALENDAR_MINUTE_HEIGHT - 3
        );
        const normalizedStatus = normalizeStatus(appointment.status);
        const block = document.createElement('button');
        block.type = 'button';
        block.className =
          `calendar-appointment status-${normalizedStatus}`;
        block.style.top = `${top}px`;
        block.style.height = `${height}px`;
        block.setAttribute(
          'aria-label',
          `${formatTime(appointment.startAt)} – ${formatTime(appointment.endAt)}, ${appointment.customerName || ''}, ${appointment.serviceName || ''}`
        );

        block.appendChild(
          createTextElement(
            'span',
            'calendar-appointment-time',
            `${formatTime(appointment.startAt)} – ${formatTime(appointment.endAt)}`
          )
        );
        block.appendChild(
          createTextElement(
            'span',
            'calendar-appointment-name',
            appointment.customerName || '—'
          )
        );
        block.appendChild(
          createTextElement(
            'span',
            'calendar-appointment-service',
            appointment.serviceName || '—'
          )
        );

        if (height >= 92 && appointment.customerPhone) {
          block.appendChild(
            createTextElement(
              'span',
              'calendar-appointment-phone',
              appointment.customerPhone
            )
          );
        }

        block.addEventListener(
          'click',
          () => openAppointmentSheet(appointment)
        );
        timeline.appendChild(block);
      });

      if (visibleAppointmentCount === 0) {
        timeline.appendChild(
          createTextElement(
            'div',
            'calendar-empty-note',
            currentText().noAppointments
          )
        );
      }

      scroll.appendChild(timeline);
      calendar.appendChild(scroll);
      elements.appointmentList.replaceChildren(calendar);
    };

    const renderStatePanel = (message, buttonText, action) => {
      const panel = document.createElement('div');
      panel.className = 'state-panel';
      panel.appendChild(createTextElement('p', '', message));

      if (buttonText && action) {
        const button = createTextElement(
          'button',

        button.type = 'button';
        button.addEventListener('click', action);
        panel.appendChild(button);

      elements.appointmentList.replaceChildren(panel);

    const render = () => {
      const text = currentText();

      document.documentElement.lang = state.language === 'zh'
        ? 'zh-CN'
        : 'en';
      document.title = text.pageTitle;
      elements.pageTitle.textContent = text.pageTitle;
      elements.todayButton.textContent = text.today;
      elements.tomorrowButton.textContent = text.tomorrow;
      elements.datePickerText.textContent = text.selectDate;
      elements.viewList.textContent = text.list;
      elements.viewCalendar.textContent = text.calendar;
      elements.calendarToday.textContent = text.today;
      elements.previousDay.setAttribute(
        'aria-label',
        text.previousDay
      );
      elements.nextDay.setAttribute(
        'aria-label',
        text.nextDay
      );
      elements.languageEn.classList.toggle(
        'active',
        state.language === 'en'
      );
      elements.languageZh.classList.toggle(
        'active',
        state.language === 'zh'
      );
      elements.languageEn.setAttribute(
        'aria-pressed',
        String(state.language === 'en')
      );
      elements.languageZh.setAttribute(
        'aria-pressed',
        String(state.language === 'zh')
      );
      elements.viewList.classList.toggle(
        'active',
        state.displayMode === 'list'
      );
      elements.viewCalendar.classList.toggle(
        'active',
        state.displayMode === 'calendar'
      );
      elements.viewList.setAttribute(
        'aria-pressed',
        String(state.displayMode === 'list')
      );
      elements.viewCalendar.setAttribute(
        'aria-pressed',
        String(state.displayMode === 'calendar')
      );
      elements.calendarNavigation.classList.toggle(
        'visible',
        state.displayMode === 'calendar'
      );
      elements.calendarDate.textContent = formatCalendarDate(
        state.selectedDate
      );

      elements.staffName.textContent = state.profile
        ? state.profile.name
        : '';
      elements.locationName.textContent = state.profile
        ? `${state.profile.shopName} · ${state.profile.locationName}`
        : '';
      elements.selectedDate.textContent = formatDate(
        state.selectedDate
      );
      elements.loadingLabel.textContent = state.loading
        ? text.loading
        : '';
      elements.todayButton.classList.toggle(
        'active',
        state.selectionMode === 'today'
      );
      elements.tomorrowButton.classList.toggle(
        'active',
        state.selectionMode === 'tomorrow'
      );
      elements.datePicker.value =
        state.selectionMode === 'custom' && state.selectedDate
          ? state.selectedDate
          : '';
      elements.appointmentsSection.setAttribute(
        'aria-busy',
        String(state.loading)
      );

      if (state.loading) {
        const skeletons = [1, 2].map(() => {
          const skeleton = document.createElement('div');
          skeleton.className = 'appointment-card skeleton';
          return skeleton;
        });
        elements.appointmentList.replaceChildren(...skeletons);
        return;
      }

      if (state.view === 'session') {
        renderStatePanel(
          text.sessionExpired,
          text.logIn,
          () => {
            window.location.href = '/staff-login.html';
          }
        );
        return;
      }

      if (state.view === 'error') {
        renderStatePanel(
          text.loadFailed,
          text.retry,
          loadPage
        );
        return;
      }

      if (state.displayMode === 'calendar') {
        renderCalendar();
        return;
      }

      if (state.appointments.length === 0) {
        renderStatePanel(
          state.selectionMode === 'today'
            ? text.noAppointmentsToday
            : text.noAppointmentsDate
        );
        return;
      }

      elements.appointmentList.replaceChildren(
        ...state.appointments.map(renderAppointmentCard)
      );
    };

    const fetchJson = async url => {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: {
          Accept: 'application/json'
        }
      });

      if (response.status === 401) {
        const sessionError = new Error('session_expired');
        sessionError.isSessionError = true;
        throw sessionError;
      }

      if (!response.ok) {
        throw new Error('request_failed');
      }

      const payload = await response.json();

      if (!payload.success) {
        throw new Error('request_failed');
      }

      return payload.data;
    };

    const loadAppointments = async date => {
      state.loading = true;
      state.view = 'content';
      render();

      try {
        const url = date
          ? `/api/staff/appointments?date=${encodeURIComponent(date)}`
          : '/api/staff/appointments';

        const data = await fetchJson(url);
        state.selectedDate = data.date;
        if (!date) {
          state.todayDate = data.date;
        }
        state.timezone = data.timezone || 'Asia/Singapore';
        state.appointments = Array.isArray(data.appointments)
          ? data.appointments
          : [];
      } catch (error) {
        state.appointments = [];
        state.view = error.isSessionError
          ? 'session'
          : 'error';
      } finally {
        state.loading = false;
        render();
      }
    };

    const loadPage = async () => {
      state.loading = true;
      state.view = 'content';
      render();

      try {
        const [profile, appointmentData] = await Promise.all([
          fetchJson('/api/staff/me'),
          fetchJson('/api/staff/appointments')
        ]);

        state.profile = profile;
        state.selectedDate = appointmentData.date;
        state.todayDate = appointmentData.date;
        state.timezone =
          appointmentData.timezone || 'Asia/Singapore';
        state.appointments = Array.isArray(
          appointmentData.appointments
        )
          ? appointmentData.appointments
          : [];
      } catch (error) {
        state.appointments = [];
        state.view = error.isSessionError
          ? 'session'
          : 'error';
      } finally {
        state.loading = false;
        render();
      }
    };

    const setLanguage = language => {
      state.language = language;

      try {
        localStorage.setItem(
          LANGUAGE_STORAGE_KEY,
          language
        );
      } catch (error) {
        // Language switching still works when storage is unavailable.
      }

      render();
    };

    const setDisplayMode = displayMode => {
      state.displayMode = displayMode;

      try {
        localStorage.setItem(
          VIEW_STORAGE_KEY,
          displayMode
        );
      } catch (error) {
        // The selected view still applies when storage is unavailable.
      }

      render();
    };

    elements.languageEn.addEventListener(
      'click',
      () => setLanguage('en')
    );
    elements.languageZh.addEventListener(
      'click',
      () => setLanguage('zh')
    );
    elements.viewList.addEventListener(
      'click',
      () => setDisplayMode('list')
    );
    elements.viewCalendar.addEventListener(
      'click',
      () => setDisplayMode('calendar')
    );

    elements.todayButton.addEventListener('click', () => {
      state.selectionMode = 'today';
      loadAppointments(null);
    });

    elements.tomorrowButton.addEventListener('click', () => {
      if (!state.todayDate) {
        return;
      }

      state.selectionMode = 'tomorrow';
      loadAppointments(addDays(state.todayDate, 1));
    });

    elements.datePicker.addEventListener('change', event => {
      const selectedDate = event.target.value;

      if (!selectedDate) {
        return;
      }

      state.selectionMode = 'custom';
      loadAppointments(selectedDate);
    });

    elements.previousDay.addEventListener('click', () => {
      if (!state.selectedDate) {
        return;
      }

      state.selectionMode = 'custom';
      loadAppointments(addDays(state.selectedDate, -1));
    });

    elements.nextDay.addEventListener('click', () => {
      if (!state.selectedDate) {
        return;
      }

      state.selectionMode = 'custom';
      loadAppointments(addDays(state.selectedDate, 1));
    });

    elements.calendarToday.addEventListener('click', () => {
      state.selectionMode = 'today';
      loadAppointments(null);
    });

    elements.sheetChangeTime.addEventListener(
      'click',
      openMoveTimePanel
    );
    elements.moveDate.addEventListener(
      'change',
      updateMovePreview
    );
    elements.moveStartTime.addEventListener(
      'change',
      updateMovePreview
    );
    elements.moveCancel.addEventListener(
      'click',
      closeMoveTimePanel
    );
    elements.moveConfirm.addEventListener(
      'click',
      submitAppointmentMove
    );
    elements.sheetClose.addEventListener(
      'click',
      closeAppointmentSheet
    );
    elements.appointmentModal.addEventListener('click', event => {
      if (event.target === elements.appointmentModal) {
        closeAppointmentSheet();
      }
    });
    document.addEventListener('keydown', event => {
      if (
        event.key === 'Escape' &&
        !elements.appointmentModal.hidden
      ) {
        if (!elements.moveTimePanel.hidden) {
          closeMoveTimePanel();
        } else {
          closeAppointmentSheet();
        }
      }
    });

    render();
    loadPage();
  </script>
</body>
</html>
